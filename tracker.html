  function slug(s) { return String(s || "profit-first").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "profit-first"; }

  function browserDownload(filename, json) {
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    markClean();
    showToast("Backup saved.");
  }

  function handleExport() {
    if (!hasUnexportedChanges()) {
      openConfirm("Nothing has changed since your last backup. Export anyway?", "Export anyway", false).then(function (ok) {
        if (ok) doExport();
      });
      return;
    }
    doExport();
  }

  function doExport() {
    var json = JSON.stringify(state, null, 2);
    var filename = slug(state.business) + "-backup-" + todayStr() + ".json";
    if (!window.claude || typeof window.claude.use !== "function") {
      browserDownload(filename, json);
      return;
    }
    window.claude.use("downloads").then(function (downloads) {
      if (!downloads) { browserDownload(filename, json); return; }
      return downloads.save({ filename: filename, data: json }).then(function () {
        markClean();
        showToast("Backup saved.");
      }).catch(function (err) {
        if (err && err.code === "declined") showToast("Export cancelled.");
        else showToast("Couldn't save backup.");
      });
    });
  }

  function handleImport(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(reader.result); } catch (err) { showToast("That file isn't valid JSON."); return; }
      if (!parsed || !Array.isArray(parsed.buckets) || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.transactions)) {
        showToast("That file doesn't look like a backup from this app.");
        return;
      }
      if (!parsed.accounts.some(function (a) { return a.id === CASH_ACCOUNT_ID; })) {
        parsed.accounts.push({ id: CASH_ACCOUNT_ID, name: "Cash on hand", status: "", type: "company" });
      }
      openConfirm("Import this backup? It will replace everything currently in the app.", "Import", true).then(function (ok) {
        if (!ok) return;
        state = parsed;
        persist();
        markClean();
        renderSettingsSheet();
        render();
        showToast("Backup imported.");
      });
    };
    reader.readAsText(file);
    e.target.value = "";
  }

      state = defaultState();

  // Accounts + Buckets stay unfrozen (normal scroll) by default - no
  // separate on/off setting to manage. The arrow is only eligible to show
  // at all once scrolled past FREEZE_SCROLL_THRESHOLD (no point offering
  // to pin/collapse something already at the top) - within that, it fades
  // in while actively scrolling and on hover (CSS :hover, see .eligible

  // state: double-down "pin it" when unfrozen, double-up "collapse it"
  // when frozen (updateArrowVisual below) - tapping it either freezes for
  // this scroll-down session, or collapses back to unfrozen right away.
  // Scrolling back near the top also resets to unfrozen either way.
  var FREEZE_SCROLL_THRESHOLD = 24;
  var SCROLL_IDLE_MS = 900;
  var manuallyFrozen = false;
  var scrollIdleTimer = null;
  var ARROW_ICON_DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 8 12 13 17 8"/><polyline points="7 14 12 19 17 14"/></svg>';
  var ARROW_ICON_UP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 8 17 13"/><polyline points="7 19 12 14 17 19"/></svg>';
  function updateArrowVisual(frozen) {
    var btn = document.getElementById("unfreezeArrow");
    var label = frozen ? "Collapse Accounts & Buckets" : "Freeze Accounts & Buckets";
    btn.setAttribute("aria-label", label);
    btn.setAttribute("title", label);
    btn.innerHTML = frozen ? ARROW_ICON_UP : ARROW_ICON_DOWN;
  }
  // Unfrozen, the arrow docks just under the header (topbar-h+4) because
  // by the time it reaches that point .frozen-top has already scrolled out
  // of the way. Frozen, .frozen-top stays pinned and occupies real screen
  // space instead - docking at that same shallow offset would land the
  // arrow in the middle of the pinned accounts/buckets content instead of
  // below it, so it needs to target topbar-h + the whole pinned block's
  // own height instead.
  function updateArrowDockVar(frozen) {
    var topbarH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--topbar-h")) || 64;
    var dock = frozen ? topbarH + document.getElementById("frozenTop").offsetHeight : topbarH + 4;
    document.documentElement.style.setProperty("--arrow-dock-top", dock + "px");
  }
  function updateFreezeUI() {
    var scrolled = window.scrollY > FREEZE_SCROLL_THRESHOLD;
    if (!scrolled) manuallyFrozen = false;
    var frozen = manuallyFrozen;
    document.getElementById("frozenTop").classList.toggle("is-frozen", frozen);
    document.getElementById("frozenTop").classList.toggle("is-scrolled", scrolled);
    document.querySelector("header.topbar").classList.toggle("frozen-active", frozen);
    document.getElementById("unfreezeArrow").classList.toggle("eligible", scrolled);
    updateArrowVisual(frozen);
    // frozen-active drops the header's 1px bottom border (avoids a doubled
    // line against .frozen-top's own border) - that shrinks the header by
    // 1px, so --topbar-h has to be remeasured right here, or .frozen-top's
    // sticky `top` stays pinned to the old (taller) height and leaves a
    // 1px void above it.
    updateTopbarHeightVar();
    updateArrowDockVar(frozen);
  }
  function markActivelyScrolling() {
    document.getElementById("unfreezeArrow").classList.add("is-active-scroll");
    clearTimeout(scrollIdleTimer);
    scrollIdleTimer = setTimeout(function () {
      document.getElementById("unfreezeArrow").classList.remove("is-active-scroll");
    }, SCROLL_IDLE_MS);
  }
  window.addEventListener("scroll", function () { updateFreezeUI(); markActivelyScrolling(); }, { passive: true });
  updateFreezeUI();
  document.getElementById("unfreezeArrow").addEventListener("click", function () {
    manuallyFrozen = !manuallyFrozen;
    updateFreezeUI();
  });

  document.getElementById("txOverlay").addEventListener("click", function (e) { if (e.target.id === "txOverlay") closeTxSheet(); });
  document.getElementById("settingsOverlay").addEventListener("click", function (e) { if (e.target.id === "settingsOverlay") closeSettingsSheet(); });
  document.getElementById("assessOverlay").addEventListener("click", function (e) { if (e.target.id === "assessOverlay") closeAssessSheet(); });
  document.getElementById("distributeOverlay").addEventListener("click", function (e) { if (e.target.id === "distributeOverlay") closeDistributeSheet(); });
  document.getElementById("bugReportOverlay").addEventListener("click", function (e) { if (e.target.id === "bugReportOverlay") closeBugReportSheet(); });
  document.getElementById("editSplitOverlay").addEventListener("click", function (e) { if (e.target.id === "editSplitOverlay") closeEditSplitSheet(); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (document.getElementById("txOverlay").classList.contains("open")) closeTxSheet();
    if (document.getElementById("settingsOverlay").classList.contains("open")) closeSettingsSheet();
    if (document.getElementById("assessOverlay").classList.contains("open")) closeAssessSheet();
    if (document.getElementById("distributeOverlay").classList.contains("open")) closeDistributeSheet();
    if (document.getElementById("bugReportOverlay").classList.contains("open")) closeBugReportSheet();
    if (document.getElementById("editSplitOverlay").classList.contains("open")) closeEditSplitSheet();
    if (document.getElementById("confirmOverlay").classList.contains("open")) document.getElementById("confirmOverlay").classList.remove("open");
  });
  window.addEventListener("beforeunload", function (e) {
    if (!hasUnexportedChanges()) return;
    e.preventDefault();
    e.returnValue = "";
    return "";
  });

  /* ---------------- guided tours ---------------- */
  // Whether a given tour has been seen lives outside `state` on purpose -
  // it's a per-browser UI preference, not app data, so it must never sync
  // across devices (a synced flag would mean dismissing it on one device
  // silently skips it on every other device that opens this tracker).
  // Keyed per tour (dashboard/settings) so finishing one doesn't mark the
  // other seen.
  function tourSeenKey(tourId) { return STORAGE_KEY + ".tutorialSeen." + tourId; }
  function tourSeen(tourId) { try { return localStorage.getItem(tourSeenKey(tourId)) === "1"; } catch (e) { return true; } }
  function markTourSeen(tourId) { try { localStorage.setItem(tourSeenKey(tourId), "1"); } catch (e) {} }

  var DASHBOARD_TOUR_STEPS = [
    { selector: "#statsRow", title: "Your accounts", body: "Bank balances at a glance - tap a card to see the breakdown." },
    { selector: "#bucketGrid", title: "Buckets", body: "Profit First splits every dollar of income across these automatically, by percentage - Profit, Owner's Pay, Tax, and Opex." },
    { selector: "#stepPromptSection", title: "What's next", body: "The next Profit First move to make - allocate income, then pay yourself - shows up here." },
    { selector: "#incomeChartSection", title: "Income", body: "Income received against target, month by month or year by year." },
    { selector: "#compositionSection", title: "Composition", body: "How your money is currently split across Buckets." },
    { selector: "#ledgerSection", title: "Ledger", body: "Every transaction - income, expenses, transfers between Buckets - lands here." },
    { selector: "#fabBtn", title: "Add a transaction", body: "Tap here any time to log income, an expense, or a transfer." },
    { selector: "#settingsBtn", title: "Settings", body: "Configure Buckets, accounts, and percentages here." }
  ];

  var SETTINGS_TOUR_STEPS = [
    { selector: "#settingsSectionBusiness", title: "Business", body: "Your business name, currency label, and whether materials pass-through costs get excluded from Real Revenue." },
    { selector: "#settingsSectionAssessment", title: "Instant Assessment", body: "Work out real starting CAP percentages from actual historical numbers instead of guessing." },
    { selector: "#settingsSectionTierPreset", title: "Revenue-tier Goal preset", body: "Apply the book's published Target Allocation percentages for your revenue band as your Goal (TAP)." },
    { selector: "#settingsSectionDebt", title: "Debt", body: "If there's real company debt on the books, distributions from Profit go 100% to paying it down first until it's clear." },
    { selector: "#settingsSectionDistribution", title: "Distribution", body: "How often - and starting when in the year - the Distribute flow becomes available." },
    { selector: "#settingsSectionOwners", title: "Owners", body: "Add owners and their ownership percentages so Distribute can auto-split the bonus portion between them." },
    { selector: "#settingsSectionBuckets", title: "Buckets", body: "CAP (current) and Goal (TAP) percentages per Bucket - add, rename, reorder tiers, or move one between Primary and Secondary here." },
    { selector: "#settingsSectionMilestones", title: "Milestone pacing", body: "Every time Real Revenue crosses another milestone this month, one CAP point moves automatically from a bucket above its Goal to one still below it - no button to press." },
    { selector: "#settingsSectionAccounts", title: "Bank Accounts", body: "Add and reorder accounts here - this order controls how they're listed everywhere else in the app." },
    { selector: "#settingsSectionData", title: "Data", body: "Export a backup, restore one, or reset everything." }
  ];

  // The element whose own scroll should reposition the tour - the window
  // for the main dashboard, but the Settings sheet has its own internal
  // overflow-y:auto scroll instead of the window scrolling, so following
  // the window's scroll event there would never fire.
  var tourStepIndex = 0;
  var tourActiveSteps = [];
  var tourScrollEl = window;
  var activeTourId = null;

  function startTour(tourId, steps, scrollEl) {
    // A truly fresh state still has empty-state sections (no data logged
    // yet) rendering nothing, and pointing a spotlight at a hidden or
    // zero-height element would just look broken - skip any step whose
    // target isn't actually visible right now rather than force every step
    // to exist.
    tourActiveSteps = steps.filter(function (step) {
      var el = document.querySelector(step.selector);
      return el && el.getBoundingClientRect().height > 4;
    });
    if (!tourActiveSteps.length) return;
    activeTourId = tourId;
    tourStepIndex = 0;
    tourScrollEl = scrollEl || window;
    buildTourDom();
    showTourStep();
    window.addEventListener("resize", handleTourReposition);
    tourScrollEl.addEventListener("scroll", handleTourReposition, { passive: true });
    document.addEventListener("click", blockClickOutsideTour, true);
  }
  function startDashboardTour() { startTour("dashboard", DASHBOARD_TOUR_STEPS, window); }
  function startSettingsTour() { startTour("settings", SETTINGS_TOUR_STEPS, document.getElementById("settingsSheet")); }

  // Blocking real page interaction used to be a full-viewport div sitting on
  // top of everything (pointer-events:auto), which is what a click-blocker
  // normally looks like - but for the Settings tour, that div's nearest
  // scrollable ancestor is the window (it's appended to <body>, a sibling of
  // the sheet, not a descendant), while the actual thing that should scroll
  // is the Settings sheet's own internal overflow. A wheel/touch scroll
  // gesture would hit the div first and get chained to the wrong container
  // - the window scrolled (invisibly, behind the modal) while the sheet
  // itself never moved. A capture-phase click listener blocks exactly the
  // same interactions (anything that isn't the tooltip's own buttons)
  // without physically sitting in the scroll-hit-test path at all, so
  // native wheel/touch scrolling on whichever element actually owns it
  // keeps working correctly under both tours.
  function blockClickOutsideTour(e) {
    var tip = document.getElementById("tutorialTooltip");
    if (tip && tip.contains(e.target)) return;
    e.preventDefault();
    e.stopPropagation();
  }

  function buildTourDom() {
    if (document.getElementById("tutorialSpotlight")) return;
    var spot = document.createElement("div");
    spot.id = "tutorialSpotlight";
    spot.className = "tutorial-spotlight";
    document.body.appendChild(spot);
    var tip = document.createElement("div");
    tip.id = "tutorialTooltip";
    tip.className = "tutorial-tooltip";
    document.body.appendChild(tip);
  }

  function endTour() {
    window.removeEventListener("resize", handleTourReposition);
    if (tourScrollEl) tourScrollEl.removeEventListener("scroll", handleTourReposition);
    document.removeEventListener("click", blockClickOutsideTour, true);
    ["tutorialSpotlight", "tutorialTooltip"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    });
    if (activeTourId) markTourSeen(activeTourId);
    activeTourId = null;
  }

  // Polls `el`'s bounding rect on animation frames and calls `done` once it
  // reports the same rect on two consecutive frames (layout has stopped
  // moving), or after ~1s as a hard fallback so a step can never hang the
  // tour if something keeps the layout in flux.
  function waitForLayoutSettle(el, done) {
    var finished = false;
    function finish() { if (finished) return; finished = true; done(); }
    var lastRect = null, stableFrames = 0, totalFrames = 0;
    function check() {
      if (finished) return;
      var r = el.getBoundingClientRect();
      var same = lastRect && r.top === lastRect.top && r.left === lastRect.left && r.height === lastRect.height && r.width === lastRect.width;
      stableFrames = same ? stableFrames + 1 : 0;
      lastRect = r;
      totalFrames += 1;
      if (stableFrames >= 3 || totalFrames >= 60) { finish(); return; }
      requestAnimationFrame(check);
    }
    requestAnimationFrame(check);
    // requestAnimationFrame only fires on an actual paint, which a
    // backgrounded or unfocused tab can throttle or stop firing entirely -
    // this wall-clock fallback guarantees the tour still advances even
    // then, instead of hanging on a step forever.
    setTimeout(finish, 900);
  }

  function showTourStep() {
    var step = tourActiveSteps[tourStepIndex];
    var el = document.querySelector(step.selector);
    if (!el) { nextTourStep(); return; }
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    // A fixed delay isn't reliable here: the smooth scroll itself has no
    // fixed duration, and the dashboard's own scroll-driven "freeze" header
    // (updateFreezeUI, triggered by the scroll events scrollIntoView just
    // fired) can keep resizing the topbar and shifting everything below it
    // for a bit after the scroll visually looks done - measuring too early
    // leaves the spotlight aimed at where the target USED to be. Polling
    // until the target's own rect stops moving between two checks (rather
    // than guessing a duration) is what actually waits for both to settle.
    waitForLayoutSettle(el, function () { positionTour(el, step); });
  }

  // Builds this step's tooltip content and wires its buttons - called once
  // per step. Positioning itself (repositionTourBoxes) is split out so
  // scroll/resize can re-run just the geometry, cheaply, without rebuilding
  // the content or re-attaching listeners on every scroll event.
  function positionTour(el, step) {
    var spot = document.getElementById("tutorialSpotlight");
    if (!spot) return; // tour was skipped/ended during the scroll delay

    var isFirst = tourStepIndex === 0;
    var isLast = tourStepIndex === tourActiveSteps.length - 1;
    var tip = document.getElementById("tutorialTooltip");
    tip.innerHTML =
      '<div class="tutorial-tooltip-title">' + esc(step.title) + '</div>' +
      '<div class="tutorial-tooltip-body">' + esc(step.body) + '</div>' +
      '<div class="tutorial-tooltip-footer">' +
        '<button type="button" class="link-btn" id="tutorialSkip">Skip tour</button>' +
        '<div class="tutorial-tooltip-nav">' +
          '<span class="tutorial-tooltip-count">' + (tourStepIndex + 1) + '/' + tourActiveSteps.length + '</span>' +
          (isFirst ? '' : '<button type="button" class="tutorial-btn tutorial-btn-icon" id="tutorialPrev" aria-label="Back">' + backIcon() + '</button>') +
          '<button type="button" class="tutorial-btn tutorial-btn-primary" id="tutorialNext">' + (isLast ? "Done" : "Next") + '</button>' +
        '</div>' +
      '</div>';

    repositionTourBoxes(el);

    document.getElementById("tutorialSkip").addEventListener("click", endTour);
    document.getElementById("tutorialNext").addEventListener("click", function () {
      if (isLast) endTour(); else nextTourStep();
    });
    var prevBtn = document.getElementById("tutorialPrev");
    if (prevBtn) prevBtn.addEventListener("click", prevTourStep);
  }

  // Pure geometry - moves the spotlight cutout and tooltip to wherever `el`
  // is on screen right now, without touching the tooltip's content or
  // listeners. Scrolling is intentionally left free during the tour (only
  // clicking the real page is blocked, via the click-catcher) so this runs
  // on every scroll/resize to keep the spotlight glued to its target
  // instead of drifting off it.
  function repositionTourBoxes(el) {
    var spot = document.getElementById("tutorialSpotlight");
    var tip = document.getElementById("tutorialTooltip");
    if (!spot || !tip) return;
    var rect = el.getBoundingClientRect();
    var pad = 8;
    spot.style.top = (rect.top - pad) + "px";
    spot.style.left = (rect.left - pad) + "px";
    spot.style.width = (rect.width + pad * 2) + "px";
    spot.style.height = (rect.height + pad * 2) + "px";

    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var spaceBelow = vh - rect.bottom, spaceAbove = rect.top;
    var top = (spaceBelow >= th + 24 || spaceBelow >= spaceAbove) ? (rect.bottom + pad + 12) : (rect.top - pad - 12 - th);
    top = Math.max(10, Math.min(top, vh - th - 10));
    var left = Math.max(10, Math.min(rect.left + rect.width / 2 - tw / 2, vw - tw - 10));
    tip.style.top = top + "px";
    tip.style.left = left + "px";
  }

  function nextTourStep() {
    tourStepIndex += 1;
    if (tourStepIndex >= tourActiveSteps.length) { endTour(); return; }
    showTourStep();
  }
  function prevTourStep() {
    tourStepIndex = Math.max(0, tourStepIndex - 1);
    showTourStep();
  }
  function handleTourReposition() {
    if (!document.getElementById("tutorialSpotlight")) return;
    var step = tourActiveSteps[tourStepIndex];
    var el = step && document.querySelector(step.selector);
    if (el) repositionTourBoxes(el);
  }

  document.getElementById("helpBtn").addEventListener("click", startDashboardTour);

  var recurringCount = processRecurringTransactions();
  if (migrateSplitDescriptions()) persist();
  render();
  if (recurringCount > 0) showToast(recurringCount === 1 ? "1 recurring entry logged automatically." : (recurringCount + " recurring entries logged automatically."));
  syncFromServer(true);
  if (!tourSeen("dashboard")) setTimeout(startDashboardTour, 500);
})();
</script>
