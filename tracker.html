<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Am Money — Company Tracker</title>
<style>
  :root {
    --ink: #12181B;
    --paper: #F1F2EC;
    --surface: #FFFFFF;
    --surface-2: #E7E8E1;
    --text: #1B211F;
    --text-muted: #5B6560;
    --border: #D7D9CF;

    --accent: #1F5C4D;      --accent-soft: #E4EEE9;
    --gold: #9C7A24;        --gold-soft: #F3ECD9;
    --clay: #A5432B;        --clay-soft: #F4E3DD;
    --slate: #3E5C76;       --slate-soft: #E2E8ED;
    --plum: #6B4C82;        --plum-soft: #EBE3F0;
    --moss: #55702E;        --moss-soft: #E7EDD9;

    --danger: #B23A2E;
    --danger-soft: #F5E1DE;
    --focus: #1F5C4D;

    --font-display: "Iowan Old Style", "Palatino Linotype", "URW Palladio L", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

    --content-max: 640px;
    color-scheme: light;
  }
  @media (min-width: 860px) { :root { --content-max: 900px; } }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ECEFE9;
      --paper: #10151A;
      --surface: #171D22;
      --surface-2: #232A2F;
      --text: #E7EAE3;
      --text-muted: #9AA59D;
      --border: #2B3339;

      --accent: #57B394;      --accent-soft: #17332C;
      --gold: #D9AB4C;        --gold-soft: #362C16;
      --clay: #E1785C;        --clay-soft: #3A241C;
      --slate: #86A9CC;       --slate-soft: #202C38;
      --plum: #B491CC;        --plum-soft: #2B2333;
      --moss: #9CBE6E;        --moss-soft: #26301A;

      --danger: #E2685A;
      --danger-soft: #3A211D;
      --focus: #57B394;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ink: #ECEFE9;
    --paper: #10151A;
    --surface: #171D22;
    --surface-2: #232A2F;
    --text: #E7EAE3;
    --text-muted: #9AA59D;
    --border: #2B3339;

    --accent: #57B394;      --accent-soft: #17332C;
    --gold: #D9AB4C;        --gold-soft: #362C16;
    --clay: #E1785C;        --clay-soft: #3A241C;
    --slate: #86A9CC;       --slate-soft: #202C38;
    --plum: #B491CC;        --plum-soft: #2B2333;
    --moss: #9CBE6E;        --moss-soft: #26301A;

    --danger: #E2685A;
    --danger-soft: #3A211D;
    --focus: #57B394;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.45;
    padding-bottom: 96px;
  }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  a { color: var(--accent); }

  /* ---------- layout ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    max-width: var(--content-max); margin: 0 auto;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand h1 { font-size: 1.25rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .eyebrow { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); flex: 0 0 auto;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  .stats-row {
    display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0; max-width: var(--content-max); margin: 0 auto;
  }
  .stats-row-accounts {
    display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
  }
  .stats-row-accounts::-webkit-scrollbar { display: none; }
  @media (min-width: 460px) {
    .stats-row { flex-direction: row; flex-wrap: wrap; }
    .stats-row-accounts { display: contents; }
    .stats-row-accounts .stat { flex: 0 0 calc((100% - 32px) / 5); }
  }
  .stat {
    flex: 1 1 130px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 10px; min-width: 0; container-type: inline-size;
  }
  @media (max-width: 459px) {
    .stats-row-accounts .stat { flex: 1 0 30%; scroll-snap-align: start; scroll-snap-stop: always; }
  }
  .stat .label {
    font-size: clamp(0.52rem, 6.5cqw, 0.63rem); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted);
    overflow-wrap: break-word; word-break: break-word;
  }
  .stat .value {
    font-size: clamp(0.78rem, 11cqw, 1rem); font-weight: 600; margin-top: 2px;
    overflow-wrap: break-word; word-break: break-word;
  }
  .stat.total { background: var(--surface-2); width: 100%; padding: 9px 10px; flex: 0 0 auto; }
  .total-label-short { display: none; }
  @media (min-width: 460px) {
    .stat.total { width: auto; flex: 1 1 130px; }
    .stat.total .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .total-label-full { display: none; }
    .total-label-short { display: inline; }
    .total-note { font-size: 0.85em; font-weight: 400; color: var(--text-muted); opacity: 0.85; }
  }
  .acct-type-tag { font-size: 0.6rem; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.03em; }

  section.block { padding: 20px 16px 0; max-width: var(--content-max); margin: 0 auto; }
  .block h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .block h2 .sub { font-family: var(--font-body); font-weight: 400; font-size: 0.78rem; color: var(--text-muted); }

  /* ---------- bucket cards ---------- */
  .bucket-grid {
    display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
  }
  .bucket-grid::-webkit-scrollbar { display: none; }
  @media (min-width: 460px) {
    .bucket-grid { display: grid; grid-template-columns: repeat(4, 1fr); overflow-x: visible; scroll-snap-type: none; }
  }
  @media (min-width: 860px) { .bucket-grid { grid-template-columns: repeat(5, 1fr); } }

  .bucket-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    border-top: 3px solid var(--bucket-color, var(--accent));
    flex: 1 0 44%; scroll-snap-align: start; scroll-snap-stop: always;
  }
  @media (min-width: 460px) { .bucket-card { flex: initial; } }
  .bucket-name { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
  .bucket-balance { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  .pill {
    display: inline-block; font-size: 0.68rem; padding: 2px 7px; border-radius: 999px;
    background: var(--bucket-soft, var(--surface-2)); color: var(--bucket-color, var(--text));
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; width: fit-content;
  }
  .progress { position: relative; height: 7px; border-radius: 999px; background: var(--bucket-soft, var(--surface-2)); overflow: visible; margin-top: 2px; }
  .progress-fill { position: absolute; inset: 0; width: 0%; background: var(--bucket-color, var(--accent)); border-radius: 999px; transition: width .4s ease; }
  .progress-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.55; left: 0%; }
  .bucket-caption { font-size: 0.68rem; color: var(--text-muted); }

  .info-dot {
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2);
    font-size: 0.62rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-style: italic; font-family: Georgia, serif; padding: 0; vertical-align: middle;
  }
  .bucket-section { margin-bottom: 14px; }
  .bucket-section:last-child { margin-bottom: 0; }
  .bucket-section-title {
    font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .comp-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .income-chart-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .income-chart-nav .icon-btn { width: 30px; height: 30px; }
  .income-chart-nav-label { font-size: 0.82rem; font-weight: 600; }
  .mo-wrap { display: flex; margin-top: 10px; }
  .mo-axis { width: 34px; flex-shrink: 0; position: relative; height: 150px; }
  .mo-tick-num { position: absolute; right: 10px; transform: translateY(-50%); font-size: 0.52rem; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mo-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: 0.25; }
  .mo-tick-mark { position: absolute; left: 0; width: 8px; height: 1px; background: var(--border); opacity: 0.25; }
  .mo-bars-outer { flex: 1; min-width: 0; }
  .mo-bars { display: flex; align-items: flex-end; height: 150px; gap: 2px; border-bottom: 1px solid var(--border); position: relative; }
  .mo-col { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; min-width: 0; cursor: default; }
  .mo-bar { width: 100%; max-width: 12px; margin: 0 auto; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 0; transition: opacity 0.15s ease; }
  .mo-col.has-data .mo-bar { min-height: 2px; }
  .mo-col.has-data:hover .mo-bar { opacity: 0.8; }
  .mo-axis-labels { display: flex; gap: 2px; margin-top: 4px; }
  .mo-axis-label { flex: 1; text-align: center; font-size: 0.5rem; color: var(--text-muted); min-width: 0; }
  .income-chart-tooltip { position: absolute; pointer-events: none; left: 0; top: 0; width: max-content; max-width: min(220px, calc(100vw - 32px)); background: #12181B; color: #fff; font-size: 0.68rem; line-height: 1.55; padding: 8px 10px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); z-index: 30; opacity: 0; transform: translate(-50%, calc(-100% - 8px)); transition: opacity 0.1s ease; }
  .income-chart-tooltip.show { opacity: 1; }
  .income-chart-tooltip .tt-title { font-weight: 700; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .income-chart-tooltip .tt-row { display: flex; align-items: center; gap: 6px; }
  .income-chart-tooltip .tt-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .income-chart-tooltip .tt-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .income-chart-tooltip .tt-amt { margin-left: 14px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .income-chart-tooltip .tt-total { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.22); font-weight: 700; display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .comp-title .sub { font-family: var(--font-body); font-weight: 400; font-size: 0.7rem; color: var(--text-muted); }

  .ie-chart { margin-top: 10px; }
  .ie-legend { display: flex; justify-content: center; gap: 18px; margin-bottom: 10px; }
  .ie-legend-item { display: flex; flex-direction: row; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-muted); }
  .ie-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .ie-wrap { display: flex; }
  .ie-axis { width: 34px; flex-shrink: 0; position: relative; height: 220px; }
  .ie-tick-num { position: absolute; right: 10px; transform: translateY(-50%); font-size: 0.52rem; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ie-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: 0.25; }
  .ie-tick-mark { position: absolute; left: 0; width: 11px; height: 1px; background: var(--border); opacity: 0.25; }
  .ie-plot-outer { flex: 1; min-width: 0; position: relative; }
  .ie-plot { position: relative; height: 220px; display: flex; flex-direction: column; }
  .ie-half { flex: 1; position: relative; }
  .ie-bar { position: absolute; width: var(--ie-bar-w, 11px); min-height: 0; cursor: default; }
  .ie-half-upper .ie-bar { bottom: 0; }
  .ie-half-lower .ie-bar { top: 0; }
  .ie-bar-exp { background: var(--clay); border-radius: 0 0 3px 3px; }
  .ie-bar-inc { background: var(--accent); border-radius: 3px 3px 0 0; }
  .ie-bar-net { background: var(--gold); }
  .ie-bar-net.ie-up { border-radius: 3px 3px 0 0; }
  .ie-bar-net.ie-down { border-radius: 0 0 3px 3px; }
  .ie-gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: 0.25; }
  .ie-zeroline { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--border); opacity: 0.25; }
  .ie-pct { position: absolute; transform: translateX(-50%); font-size: 0.56rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) { .ie-pct { font-size: 0.44rem; } }
  .ie-pct-top { top: 0; color: var(--accent); }
  .ie-pct-bottom { bottom: 0; color: var(--clay); }
  .ie-month-labels { position: relative; height: 16px; margin-top: 6px; }
  .ie-month-label { position: absolute; transform: translateX(-50%); font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
  .comp-bar { display: flex; gap: 2px; height: 22px; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .comp-seg { min-width: 3px; }
  .comp-legend { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .comp-legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
  .comp-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .comp-legend-label { flex: 1; color: var(--text); }
  .comp-legend-val { color: var(--text-muted); font-size: 0.74rem; }

  .split-row { margin-bottom: 8px; }
  .split-remaining { font-size: 0.78rem; font-weight: 600; margin: 4px 0 13px; }
  .split-remaining.ok { color: var(--accent); }
  .split-remaining.bad { color: var(--danger); }
  .ledger-floor-note {
    font-size: 0.72rem; color: var(--danger); font-weight: 600; line-height: 1.35; margin-top: 6px;
  }
  .bucket-activity {
    font-size: 0.66rem; color: var(--text-muted); line-height: 1.35; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: break-word; word-break: break-word;
  }

  .acct-status {
    display: inline-block; font-size: 0.64rem; font-weight: 600; padding: 2px 7px;
    border-radius: 999px; background: var(--clay-soft); color: var(--clay);
    margin-left: 6px; white-space: nowrap; vertical-align: middle;
  }

  /* ---------- ledger ---------- */
  .ledger-filter-bar { margin-bottom: 12px; }
  .ledger-filters-details { margin-top: 8px; }
  .ledger-filters-details summary { cursor: pointer; font-size: 0.83rem; font-weight: 600; color: var(--text-muted); padding: 4px 0; list-style: none; display: flex; align-items: center; gap: 6px; }
  .ledger-filters-details summary::-webkit-details-marker { display: none; }
  .ledger-filters-details summary::before { content: "▸"; font-size: 0.7rem; }
  .ledger-filters-details[open] summary::before { content: "▾"; }
  .ledger-filters-details > .field, .ledger-filters-details > .row2 { margin-top: 10px; }
  .filter-badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 999px; }
  .ledger-list { display: flex; flex-direction: column; gap: 8px; }
  .ledger-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px 13px; }
  .ledger-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .ledger-top > div:first-child { min-width: 0; }
  .ledger-desc { font-size: 0.88rem; font-weight: 600; overflow-wrap: break-word; word-break: break-word; }
  .ledger-date { font-size: 0.7rem; color: var(--text-muted); margin-top: 1px; }
  .ledger-amt { font-size: 0.95rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .ledger-amt.pos { color: var(--accent); }
  .ledger-amt.neg { color: var(--clay); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip {
    font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; font-family: var(--font-mono);
    background: var(--chip-soft, var(--surface-2)); color: var(--chip-color, var(--text-muted));
  }
  .ledger-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }
  .recurring-badge { background: var(--gold-soft); color: var(--gold); font-family: var(--font-body); font-weight: 600; }
  .ledger-user-note { font-style: italic; color: var(--text); white-space: pre-wrap; }
  .ledger-actions { display: flex; gap: 8px; margin-top: 9px; }
  .link-btn { font-size: 0.75rem; color: var(--accent); background: none; border: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .link-btn.danger { color: var(--danger); }

  .empty-state { text-align: center; padding: 26px 14px; color: var(--text-muted); font-size: 0.85rem; border: 1px dashed var(--border); border-radius: 14px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 20px; bottom: 24px; z-index: 30;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: var(--paper); border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .fab:hover { filter: brightness(1.06); }

  /* ---------- sheet / modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.42);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s ease;
    padding: 16px;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; max-width: 560px; background: var(--surface);
    border-radius: 18px; padding: 18px;
    max-height: 88vh; overflow-y: auto;
    transform: scale(0.96); transition: transform .2s ease;
    border: 1px solid var(--border);
  }
  .overlay.open .sheet { transform: scale(1); }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .sheet { transition: none; }
  }
  @media (max-width: 600px) {
    .overlay { align-items: flex-end; padding: 0; }
    .sheet {
      max-width: 100%; border-radius: 18px 18px 0 0; max-height: 90vh;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateY(100%); transition: transform .24s ease;
    }
    .overlay.open .sheet { transform: translateY(0); }
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h3 { font-size: 1.05rem; }

  .segmented { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 16px; }
  .segmented button { flex: 1; border: none; background: transparent; padding: 8px 6px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
  .segmented-5 button { padding: 8px 2px; font-size: 0.72rem; }
  .segmented-compact { padding: 2px; gap: 2px; border-radius: 8px; }
  .segmented-compact button { padding: 5px 8px; font-size: 0.68rem; border-radius: 6px; white-space: nowrap; }
  .segmented button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
  .field label { font-size: 0.74rem; font-weight: 600; color: var(--text-muted); }
  .input, .select {
    width: 100%; padding: 10px 11px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--paper); color: var(--text); font-size: 0.92rem;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
