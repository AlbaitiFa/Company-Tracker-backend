  function renderLedgerItem(tx, splitBadge) {
    var isOut = tx.type === "expense" || tx.type === "payout";
    var isIn = tx.type === "income" || tx.type === "opening_balance";
    var amtClass = isIn ? "pos" : (isOut ? "neg" : "");
    var amtSign = isIn ? "+" : (isOut ? "−" : "");
    var chips = "", note = "";

    var recurringBadge = tx.recurring && tx.recurring.active ? '<span class="chip recurring-badge">↻ ' + esc(tx.recurring.frequency) + '</span>'
      : (tx.recurringSourceId ? '<span class="chip recurring-badge">↻ auto-logged</span>' : "");

    if (tx.type === "income") {
      var acct = accountById(tx.accountId);
      chips = '<div class="chip-row">' + Object.keys(tx.split || {}).map(function (bid) {
        var b = bucketById(bid); if (!b) return "";
        var hue = bucketColor(bucketIndex(bid));
        return '<span class="chip" style="--chip-soft:var(--' + hue + '-soft);--chip-color:var(--' + hue + ')">' + esc(b.name) + ' ' + fmt(tx.split[bid]) + '</span>';
      }).join("") + recurringBadge + '</div>';
      var mc = tx.materialsCost || 0;
      var noteBits = ["Into " + (acct ? esc(acct.name) : "(deleted account)")];
      if (mc > 0) noteBits.push("Real Revenue " + fmt(tx.amount - mc) + " of " + fmt(tx.amount) + " (" + fmt(mc) + " materials pass-through)");
      noteBits.push(tx.pending ? "pending confirmation" : "confirmed");
      if (tx.historical) noteBits.push("historical, balance unaffected");
      note = noteBits.join(" · ");
    } else if (tx.type === "expense") {
      var b2 = bucketById(tx.bucketId);
      var acct2 = accountById(tx.accountId);
      var parts = [];
      if (tx.affectsBucket && b2) {
        var hue2 = bucketColor(bucketIndex(tx.bucketId));
        parts.push('<span class="chip" style="--chip-soft:var(--' + hue2 + '-soft);--chip-color:var(--' + hue2 + ')">' + esc(b2.name) + '</span>');
      } else if (b2) {
        parts.push('<span class="chip">' + esc(b2.name) + ' (bucket unaffected)</span>');
      }
      if (recurringBadge) parts.push(recurringBadge);
      chips = parts.length ? '<div class="chip-row">' + parts.join("") + '</div>' : "";
      note = (tx.affectsAccount ? "From " + (acct2 ? esc(acct2.name) : "(deleted account)") : "Account unaffected");
      if (tx.historical) note += " · historical, balance unaffected";
    } else if (tx.type === "transfer") {
      var fromA = accountById(tx.accountId), toA = accountById(tx.toAccountId);
      note = (fromA ? esc(fromA.name) : "?") + " → " + (toA ? esc(toA.name) : "?");
    } else if (tx.type === "payout") {
      var bP = bucketById(tx.bucketId);
      var toBucket = tx.toBucketId ? bucketById(tx.toBucketId) : null;
      var toAcct = tx.toAccountId ? accountById(tx.toAccountId) : null;
      var fromAcct = tx.fromAccountId ? accountById(tx.fromAccountId) : null;
      if (bP) {
        var hueP = bucketColor(bucketIndex(tx.bucketId));
        chips = '<div class="chip-row"><span class="chip" style="--chip-soft:var(--' + hueP + '-soft);--chip-color:var(--' + hueP + ')">' + esc(bP.name) + '</span></div>';
      }
      var destText = toBucket ? ("into " + esc(toBucket.name) + " bucket" + (toAcct ? " (" + esc(toAcct.name) + ")" : "")) : (toAcct ? "into " + esc(toAcct.name) : "paid out, not tracked further");
      note = "Out of " + (bP ? esc(bP.name) : "(deleted bucket)") + (fromAcct ? " (" + esc(fromAcct.name) + ")" : "") + " → " + destText;
    } else if (tx.type === "opening_balance") {
      var acct3 = accountById(tx.accountId);
      chips = '<div class="chip-row">' + Object.keys(tx.allocation || {}).map(function (bid) {
        var b3 = bucketById(bid); if (!b3) return "";
        var hue3 = bucketColor(bucketIndex(bid));
        return '<span class="chip" style="--chip-soft:var(--' + hue3 + '-soft);--chip-color:var(--' + hue3 + ')">' + esc(b3.name) + ' ' + fmt(tx.allocation[bid]) + '</span>';
      }).join("") + '</div>';
      note = "Into " + (acct3 ? esc(acct3.name) : "(deleted account)") + " · not counted as Real Revenue";
    }

    var actions = tx.type === "opening_balance" ? "" : '<button class="link-btn" data-action="edit" data-id="' + tx.id + '">Edit</button>';
    if (tx.type === "income" && tx.pending) {
      actions += '<button class="link-btn" data-action="confirm" data-id="' + tx.id + '">Confirm</button>';
    }
    actions += '<button class="link-btn danger" data-action="delete" data-id="' + tx.id + '">Delete</button>';

    var floorNote = lastDerived && lastDerived.txFloorNotes ? lastDerived.txFloorNotes[tx.id] : null;
    var badgeHtml = splitBadge ? '<span class="split-corner-badge">' + esc(splitBadge) + '</span>' : "";

    return (
      '<div class="ledger-item">' +
        '<div class="ledger-top">' +
          '<div><div class="ledger-desc">' + esc(tx.description || "(no description)") + '</div><div class="ledger-date">' + esc(tx.date) + '</div></div>' +
          '<div class="ledger-amt num ' + amtClass + '">' + curr() + ' ' + amtSign + fmt(tx.amount) + '</div>' +
        '</div>' +
        chips +
        '<div class="ledger-note">' + note + '</div>' +
        (tx.notes ? '<div class="ledger-note ledger-user-note">' + esc(tx.notes) + '</div>' : "") +
        (floorNote ? '<div class="ledger-floor-note">' + floorNote + '</div>' : "") +
        '<div class="ledger-actions">' + actions + badgeHtml + '</div>' +
      '</div>'
    );
  }

  /* ---------------- confirm dialog ---------------- */
  function openConfirm(message, confirmLabel, danger) {
    return new Promise(function (resolve) {
      var overlay = document.getElementById("confirmOverlay");
      var sheet = document.getElementById("confirmSheet");
      sheet.innerHTML =
        '<div class="confirm-msg">' + esc(message) + '</div>' +
        '<div class="btn-row">' +
          '<button class="btn" id="confirmCancel">Cancel</button>' +
          '<button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" id="confirmOk">' + esc(confirmLabel || "Confirm") + '</button>' +
        '</div>';
      function close(result) {
        overlay.classList.remove("open");
        resolve(result);
      }
      sheet.querySelector("#confirmCancel").onclick = function () { close(false); };
      sheet.querySelector("#confirmOk").onclick = function () { close(true); };
      overlay.onclick = function (e) { if (e.target === overlay) close(false); };
      overlay.classList.add("open");
    });
  }

  function openChoice(message, labelA, labelB) {
    return new Promise(function (resolve) {
      var overlay = document.getElementById("confirmOverlay");
      var sheet = document.getElementById("confirmSheet");
      sheet.innerHTML =
        '<div class="confirm-msg">' + esc(message) + '</div>' +
        '<div class="btn-row">' +
          '<button class="btn" id="choiceB">' + esc(labelB) + '</button>' +
          '<button class="btn btn-primary" id="choiceA">' + esc(labelA) + '</button>' +
        '</div>';

        overlay.classList.remove("open");
        resolve(result);
      }
      sheet.querySelector("#choiceB").onclick = function () { close("B"); };
      sheet.querySelector("#choiceA").onclick = function () { close("A"); };

    });

  /* ---------------- transaction sheet ---------------- */
  var txTab = "income";
  var editingTxId = null;
  var ledgerFilter = {
    search: "", type: "", bucketId: "", accountId: "",
    dateFrom: "", dateTo: "", amountMin: "", amountMax: "",
    sortBy: "date-desc"
  };

  function openTxSheet(tab) {
    txTab = tab || "income";
    editingTxId = null;
    document.getElementById("txOverlay").classList.add("open");
    renderTxSheet();
  }
  function openEditTxSheet(tx) {
    editingTxId = tx.id;
    txTab = (tx.type === "payout" && tx.toBucketId) ? "move" : tx.type;
    document.getElementById("txOverlay").classList.add("open");
    renderTxSheet();
  }
  function closeTxSheet() { editingTxId = null; document.getElementById("txOverlay").classList.remove("open"); }

  /* ---------------- split group edit/delete ----------------
     Edit/Delete on ANY leg of a split acts on the WHOLE linked group, not
     just that one underlying transaction - it's one logical action to the
     user (a payout funded from N buckets, or an expense paid from N
     accounts), so it should have one edit window and one delete, not a
     different-looking form depending on which card you happened to click.
     This sheet is separate from the normal single-transaction txSheet
     because its shape is fundamentally different (a variable list of
     bucket/account + amount rows instead of one amount field). */
  var editingSplitGroupId = null;

  function splitGroupRows(groupId) {
    return state.transactions.filter(function (t) { return t.splitGroupId === groupId; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
  }
  // Which dimension varies across the group's legs - the two split
  // features split different things (payout: buckets OR accounts;
  // expense: accounts only), so the edit rows mirror whichever applies.
  function splitGroupDimension(rows) {
    return rows.some(function (r) { return r.bucketId !== rows[0].bucketId; }) ? "bucket" : "account";
  }

  function openEditSplitGroupSheet(groupId) {
    editingSplitGroupId = groupId;
    document.getElementById("editSplitOverlay").classList.add("open");
    renderEditSplitSheet();
  }
  function closeEditSplitSheet() {
    editingSplitGroupId = null;
    document.getElementById("editSplitOverlay").classList.remove("open");
  }

  function deleteSplitGroup(groupId) {
    var rows = splitGroupRows(groupId);
    if (!rows.length) return Promise.resolve(false);
    var typeLabel = rows[0].type === "payout" ? "payout" : "expense";
    return openConfirm("Delete this split " + typeLabel + "? This removes all " + rows.length + " linked entries and can't be undone.", "Delete", true).then(function (ok) {
      if (!ok) return false;
      var ids = rows.map(function (r) { return r.id; });
      state.transactions = state.transactions.filter(function (t) { return t.splitGroupId !== groupId; });
      if (!state.deletedTransactionIds) state.deletedTransactionIds = [];
      ids.forEach(function (id) { if (state.deletedTransactionIds.indexOf(id) === -1) state.deletedTransactionIds.push(id); });
      persist();
      showToast("Split deleted (" + rows.length + " linked entries).");
      return true;
    });
  }

  function renderEditSplitSheet() {
    var sheet = document.getElementById("editSplitSheet");
    var rows = splitGroupRows(editingSplitGroupId);
    if (!rows.length) { closeEditSplitSheet(); return; }
    var first = rows[0];
    var isPayout = first.type === "payout";
    var dim = splitGroupDimension(rows);
    var totalNow = round2(rows.reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0));

    var destRaw = "";
    if (isPayout) {
      if (first.toBucketId) destRaw = "bucket:" + first.toBucketId;
      else if (first.toAccountId) destRaw = "account:" + first.toAccountId;
    }

    // One row per existing leg, plus empty (hidden until "+ Add another")
    // slots up to SPLIT_ROW_COUNT - same fixed-slot pattern the creation
    // forms use. A slot's own data-existing flag is what tells
    // handleEditSplitSave whether to update a real transaction or create
    // a new one for that leg.
    function rowHtml(tx, slotIndex) {
      var rowId = tx ? tx.id : ("new" + slotIndex);
      var selectHtml = dim === "bucket"
        ? '<select class="select" data-edit-split-bucket data-row-id="' + rowId + '">' + bucketOptions(tx ? tx.bucketId : null) + '</select>'
        : '<select class="select" data-edit-split-account data-row-id="' + rowId + '">' + accountOptions(tx ? (isPayout ? tx.fromAccountId : tx.accountId) : null) + '</select>';
      return '<div class="row2 split-row" data-edit-split-row' + (tx ? "" : ' style="display:none"') + '>' +
        '<div class="field"><label>' + (dim === "bucket" ? "Bucket" : "Account") + '</label>' + selectHtml + '</div>' +
        '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" min="0" value="' + (tx ? tx.amount : "") + '" data-edit-split-amount data-row-id="' + rowId + '" data-existing="' + (tx ? "1" : "0") + '"></div>' +
      '</div>';
    }
    var rowsHtml = "";
    for (var i = 0; i < SPLIT_ROW_COUNT; i++) rowsHtml += rowHtml(rows[i], i);
    var canAddMore = rows.length < SPLIT_ROW_COUNT;

    sheet.innerHTML =
      '<div class="sheet-head"><h3>Edit split ' + (isPayout ? "payout" : "expense") + '</h3><button class="icon-btn" id="editSplitClose" aria-label="Close">' + xIcon() + '</button></div>' +
      '<div class="ledger-note" style="margin:-6px 0 14px">Linked as one split — ' + rows.length + ' legs sharing this date, description' + (isPayout ? ", and destination" : "") + '.</div>' +
      '<div class="row2"><div class="field"><label>Date</label><input class="input" type="date" id="editSplitDate" value="' + esc(first.date) + '"></div>' +
      '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" min="0" id="editSplitAmount" value="' + totalNow + '"></div></div>' +
      '<div class="field"><label>Description</label><input class="input" type="text" id="editSplitDesc" value="' + esc(first.description || "") + '"></div>' +
      '<div class="field"><label>Notes (optional)</label><textarea class="input" id="editSplitNotes">' + esc(first.notes || "") + '</textarea></div>' +
      (isPayout ? '<div class="field"><label>Goes to</label><select class="select" id="editSplitDestination">' + payoutDestinationOptions(destRaw) + '</select></div>' : "") +
      rowsHtml +
      (canAddMore ? '<button type="button" class="link-btn" id="editSplitAddRow">+ Add another ' + (dim === "bucket" ? "bucket" : "account") + '</button>' : "") +
      '<div class="split-remaining" id="editSplitRemaining"></div>' +
      '<button type="button" class="btn btn-primary" id="editSplitSave" style="margin-top:6px">Save changes</button>' +
      '<button type="button" class="link-btn danger" id="editSplitDeleteAll" style="margin-top:14px">Delete this split (' + rows.length + ' linked entries)</button>';

    sheet.querySelector("#editSplitClose").addEventListener("click", closeEditSplitSheet);
    sheet.querySelector("#editSplitSave").addEventListener("click", handleEditSplitSave);
    sheet.querySelector("#editSplitDeleteAll").addEventListener("click", function () {
      deleteSplitGroup(editingSplitGroupId).then(function (ok) {
        if (ok) { closeEditSplitSheet(); render(); }
      });
    });

    var splitRows = Array.prototype.slice.call(sheet.querySelectorAll("[data-edit-split-row]"));
    var amountInputs = Array.prototype.slice.call(sheet.querySelectorAll("[data-edit-split-amount]"));
    var totalInput = sheet.querySelector("#editSplitAmount");
    function updateRemaining() {
      var total = round2(parseFloat(totalInput.value) || 0);
      var sum = 0;
      splitRows.forEach(function (row) {
        if (row.style.display === "none") return;
        sum += round2(parseFloat(row.querySelector("[data-edit-split-amount]").value) || 0);
      });
      var remaining = round2(total - sum);
      var el = sheet.querySelector("#editSplitRemaining");
      if (Math.abs(remaining) <= 0.004) { el.textContent = "Fully allocated."; el.className = "split-remaining ok"; }
      else if (remaining > 0) { el.textContent = fmt(remaining) + " left to allocate."; el.className = "split-remaining bad"; }
      else { el.textContent = fmt(Math.abs(remaining)) + " over the total amount."; el.className = "split-remaining bad"; }
    }
    totalInput.addEventListener("input", updateRemaining);
    amountInputs.forEach(function (inp) { inp.addEventListener("input", updateRemaining); });
    var addBtn = sheet.querySelector("#editSplitAddRow");
    if (addBtn) {
      addBtn.addEventListener("click", function () {
        var hiddenRow = splitRows.filter(function (r) { return r.style.display === "none"; })[0];
        if (hiddenRow) hiddenRow.style.display = "";
        if (!splitRows.some(function (r) { return r.style.display === "none"; })) addBtn.style.display = "none";
        updateRemaining();
      });
    }
    updateRemaining();
  }

  function handleEditSplitSave() {
    var sheet = document.getElementById("editSplitSheet");
    var groupId = editingSplitGroupId;
    var rows = splitGroupRows(groupId);
    if (!rows.length) { closeEditSplitSheet(); return; }
    var isPayout = rows[0].type === "payout";
    var dim = splitGroupDimension(rows);

    var date = sheet.querySelector("#editSplitDate").value || todayStr();
    var desc = (sheet.querySelector("#editSplitDesc").value || "").trim();
    var notes = sheet.querySelector("#editSplitNotes").value;
    var total = round2(parseFloat(sheet.querySelector("#editSplitAmount").value) || 0);

    var visibleRows = Array.prototype.filter.call(sheet.querySelectorAll("[data-edit-split-row]"), function (row) {
      return row.style.display !== "none";
    });
    // Every leg that already existed must stay filled in (there's no
    // "remove a leg" control here) - only a freshly added, still-empty
    // slot is allowed to have nothing in it.
    var invalidExisting = visibleRows.some(function (row) {
      var amtInput = row.querySelector("[data-edit-split-amount]");
      return amtInput.getAttribute("data-existing") === "1" && !(round2(parseFloat(amtInput.value) || 0) > 0);
    });
    if (invalidExisting) { showToast("Every existing leg needs an amount greater than 0."); return; }
    var sum = visibleRows.reduce(function (s, row) { return s + round2(parseFloat(row.querySelector("[data-edit-split-amount]").value) || 0); }, 0);
    if (Math.abs(round2(sum - total)) > 0.004) { showToast("Leg amounts must add up to the total."); return; }

    var toAccountId = null, toBucketId = null;
    if (isPayout) {
      var destRaw = sheet.querySelector("#editSplitDestination").value;
      if (destRaw.indexOf("account:") === 0) toAccountId = destRaw.slice(8);
      else if (destRaw.indexOf("bucket:") === 0) { toBucketId = destRaw.slice(7); toAccountId = effectiveBucketAccountId(bucketById(toBucketId)); }
    }

    var byId = {};
    rows.forEach(function (tx) { byId[tx.id] = tx; });
    var now = Date.now();
    var newCount = 0;

    visibleRows.forEach(function (row) {
      var amtInput = row.querySelector("[data-edit-split-amount]");
      var amount = round2(parseFloat(amtInput.value) || 0);
      if (!(amount > 0)) return; // an untouched "add another" slot
      var rowId = amtInput.getAttribute("data-row-id");
      var selectEl = row.querySelector("[data-edit-split-bucket], [data-edit-split-account]");
      var selectVal = selectEl.value;
      var tx = byId[rowId];

      if (!tx) {
        tx = {
          id: uid(), type: isPayout ? "payout" : "expense",
          createdAt: now + (newCount++), updatedAt: now,
          // Both dimensions leave bucketId shared across every leg except
          // when the split itself varies by bucket - set the shared value
          // up front so an account-dimension new leg (which never touches
          // bucketId below) still gets it.
          bucketId: rows[0].bucketId
        };
        if (!isPayout) { tx.affectsBucket = true; tx.affectsAccount = true; }
        tx.splitGroupId = groupId;
        state.transactions.push(tx);
      }
      tx.amount = amount;
      tx.date = date;
      tx.description = desc || (isPayout ? "Payout" : "Expense");
      tx.notes = notes;
      tx.updatedAt = now;
      if (isPayout) { tx.toAccountId = toAccountId; tx.toBucketId = toBucketId; }

      if (dim === "bucket") {
        tx.bucketId = selectVal;
        if (isPayout) tx.fromAccountId = effectiveBucketAccountId(bucketById(selectVal));
      } else if (isPayout) {
        tx.fromAccountId = selectVal;
      } else {
        tx.accountId = selectVal;
      }
    });

    persist();
    closeEditSplitSheet();
    render();
    showToast((isPayout ? "Payout" : "Expense") + " split updated.");
  }

  function accountOptions(selectedId) {
    return state.accounts.map(function (a) {
      return '<option value="' + a.id + '"' + (a.id === selectedId ? " selected" : "") + '>' + esc(a.name) + '</option>';
    }).join("");
  }
  function bucketOptions(selectedId, excludeId) {
    return state.buckets.filter(function (b) { return b.id !== excludeId; }).map(function (b) {
      return '<option value="' + b.id + '"' + (b.id === selectedId ? " selected" : "") + '>' + esc(b.name) + '</option>';
    }).join("");
  }

  function recurringFieldsHtml(editingTx) {
    if (editingTx && editingTx.recurringSourceId) return "";
    var rec = editingTx && editingTx.recurring;
    var checked = !!(rec && rec.active);
    var freq = rec ? rec.frequency : "monthly";
    return (
      '<label class="check-row"><input type="checkbox" id="fRecurring"' + (checked ? " checked" : "") + '> Recurring</label><div class="check-note">Auto-logs itself again on a schedule — edit the amount on each new entry if it varies.</div>' +
      '<div id="fRecurringWrap" class="field" style="display:' + (checked ? "" : "none") + '"><label>Repeats</label><select class="select" id="fRecurringFrequency">' +
        '<option value="monthly"' + (freq === "monthly" ? " selected" : "") + '>Monthly</option>' +
        '<option value="weekly"' + (freq === "weekly" ? " selected" : "") + '>Weekly</option>' +
        '<option value="yearly"' + (freq === "yearly" ? " selected" : "") + '>Yearly</option>' +
      '</select></div>'
    );
  }

  var SPLIT_ROW_COUNT = 4;
  function splitAccountsSectionHtml(prefix, defaultAccountId) {
    var rowsHtml = "";
    for (var i = 0; i < SPLIT_ROW_COUNT; i++) {
      rowsHtml += '<div class="row2 split-row" data-split-row="' + i + '"' + (i >= 2 ? ' style="display:none"' : '') + '>' +
        '<div class="field"><label>Account</label><select class="select" id="f' + prefix + 'SplitAccount' + i + '">' + accountOptions(i === 0 ? defaultAccountId : null) + '</select></div>' +
        '<div class="field"><label>Amount</label><input class="input" type="number" step="0.01" min="0" id="f' + prefix + 'SplitAmount' + i + '" placeholder="0.00"></div>' +
      '</div>';
    }
    return (
      '<label class="check-row"><input type="checkbox" id="f' + prefix + 'Split"> Split across accounts</label><div class="check-note">Divide this amount across two or more accounts.</div>' +
      '<div id="f' + prefix + 'SplitWrap" style="display:none">' +
        rowsHtml +

  function wireSplitSection(sheet, prefix, otherDiffToggleSelectors) {
    var toggle = sheet.querySelector("#f" + prefix + "Split");
    var wrap = sheet.querySelector("#f" + prefix + "SplitWrap");
    if (!toggle || !wrap) return;
    var amountInput = sheet.querySelector("#fAmount");
    var addBtn = sheet.querySelector("#f" + prefix + "SplitAddRow");
    var remainingEl = sheet.querySelector("#f" + prefix + "SplitRemaining");
    var rows = Array.prototype.slice.call(sheet.querySelectorAll("[data-split-row]"));
    var otherSelectors = [].concat(otherDiffToggleSelectors || []);

    function updateRemaining() {
      var total = round2(parseFloat(amountInput.value) || 0);
      var sum = 0;
      rows.forEach(function (row) {
        if (row.style.display === "none") return;
        sum += round2(parseFloat(row.querySelector('input[type="number"]').value) || 0);
      });
      var remaining = round2(total - sum);
      if (!remainingEl) return;
      if (Math.abs(remaining) <= 0.004) {
        remainingEl.textContent = "Fully allocated.";
        remainingEl.className = "split-remaining ok";
      } else if (remaining > 0) {
        remainingEl.textContent = fmt(remaining) + " left to allocate.";
        remainingEl.className = "split-remaining bad";
      } else {
        remainingEl.textContent = fmt(Math.abs(remaining)) + " over the total amount.";
        remainingEl.className = "split-remaining bad";
      }
    }

    toggle.addEventListener("change", function () {
      wrap.style.display = toggle.checked ? "" : "none";
      otherSelectors.forEach(function (sel) {
        var otherToggle = sheet.querySelector(sel);
        if (toggle.checked && otherToggle && otherToggle.checked) {
          otherToggle.checked = false;
          otherToggle.dispatchEvent(new Event("change", { bubbles: true }));
        }
      });
      updateRemaining();
    });
    amountInput.addEventListener("input", updateRemaining);
    rows.forEach(function (row) {
      row.querySelector('input[type="number"]').addEventListener("input", updateRemaining);
    });
    if (addBtn) {
      addBtn.addEventListener("click", function () {
        var hiddenRow = rows.find(function (r) { return r.style.display === "none"; });
        if (hiddenRow) hiddenRow.style.display = "";
        if (!rows.some(function (r) { return r.style.display === "none"; })) addBtn.style.display = "none";
        updateRemaining();
      });
    }
    updateRemaining();
  }

  function readSplitRows(sheet, prefix, totalAmount) {
    var rows = sheet.querySelectorAll("[data-split-row]");
    var result = [];
    var sum = 0;
    rows.forEach(function (row) {
      if (row.style.display === "none") return;
      var accountId = row.querySelector("select").value;
      var amt = round2(parseFloat(row.querySelector('input[type="number"]').value) || 0);
      if (amt > 0) {
        result.push({ accountId: accountId, amount: amt });
        sum += amt;
      }
    });
    var diff = round2(sum - totalAmount);
    return { rows: result, valid: result.length >= 2 && Math.abs(diff) <= 0.004 };
  }

  // Split a payout's SOURCE across two or more buckets in one go (e.g. a
  // vendor invoice funded partly from Opex, partly from Profit) - mirrors
  // splitAccountsSectionHtml/wireSplitSection/readSplitRows above but keyed
  // by bucket instead of account, and kept as its own set of functions

  // exclusive UI (this hides the single "From bucket" field entirely,

  // just add branching without saving real code.

      '<label class="check-row"><input type="checkbox" id="f' + prefix + 'BucketSplit"> Split across buckets</label><div class="check-note">Fund this payout from two or more buckets at once — it shows as one grouped entry in the ledger.</div>' +
      '<div id="f' + prefix + 'BucketSplitWrap" style="display:none">' +
        rowsHtml +

        '<div class="split-remaining" id="f' + prefix + 'BucketSplitRemaining"></div>' +

  function readSplitBucketRows(sheet, totalAmount) {
    var rows = sheet.querySelectorAll("[data-split-bucket-row]");

    rows.forEach(function (row) {
      if (row.style.display === "none") return;

      var amt = round2(parseFloat(row.querySelector('input[type="number"]').value) || 0);
      if (amt > 0) {

  function payoutDestinationOptions(selectedRaw) {
    var sel = selectedRaw || "";
    var html = '<option value=""' + (sel === "" ? " selected" : "") + '>Paid out — not tracked here</option>';
    html += state.accounts.map(function (a) {
      var val = "account:" + a.id;
      return '<option value="' + val + '"' + (sel === val ? " selected" : "") + '>' + esc(a.name) + '</option>';
    }).join("");
    return html;
  }

  function splittableBuckets() { return state.buckets.filter(function (b) { return b.tier !== "secondary"; }); }

  function computeIncomeSplit(base) {
    var buckets = splittableBuckets();
    var amounts = {}, running = 0;
    buckets.forEach(function (b, i) {
      if (i === buckets.length - 1) {
        amounts[b.id] = round2(base - running);
      } else {
        var a = Math.round(base * (Number(b.cap) || 0) / 100);
        amounts[b.id] = a; running += a;
      }
    });
    return amounts;
  }

  function splitPreviewHtml(amount, materialsCost) {
    if (!amount || amount <= 0) return "";
    var buckets = splittableBuckets();
    if (!buckets.length) return "";
    materialsCost = Math.min(materialsCost || 0, amount);
    var base = round2(amount - materialsCost);
    var sum = capSum();
    if (sum <= 0) return '<div class="bucket-caption">Set bucket CAP % in Settings to preview the split.</div>';
    var amounts = computeIncomeSplit(base);
    var html = '<div class="split-preview">' + buckets.map(function (b) {
      var hue = bucketColor(bucketIndex(b.id));
      return '<span class="chip" style="--chip-soft:var(--' + hue + '-soft);--chip-color:var(--' + hue + ')">' + esc(b.name) + ' ' + fmt(amounts[b.id]) + '</span>';
    }).join("") + '</div>';
    if (materialsCost > 0) {
      html += '<div class="bucket-caption">Real Revenue: ' + fmt(base) + ' (of ' + fmt(amount) + ' — ' + fmt(materialsCost) + ' materials pass-through, excluded)</div>';
    }
    return html;
  }

    if (fBucketSelect && txTab === "expense") {

        var eff = accountById(effId);
        var cap = document.getElementById("fExpenseAcctCaption");
        if (cap) cap.innerHTML = "From account: <strong>" + (eff ? esc(eff.name) : "—") + "</strong> (auto, linked to the bucket)";
        var accSel = document.getElementById("fAccount");

  function wireTxSheetChrome() {
    var sheet = document.getElementById("txSheet");
    sheet.querySelector("#txClose").addEventListener("click", closeTxSheet);
    sheet.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () { txTab = btn.getAttribute("data-tab"); renderTxSheet(); });
    });
  }

  function handleTxSubmit() {
    var sheet = document.getElementById("txSheet");
    var date = sheet.querySelector("#fDate").value || todayStr();
    var amount = round2(parseFloat(sheet.querySelector("#fAmount").value));
    var desc = sheet.querySelector("#fDesc").value.trim();
    var notesEl = sheet.querySelector("#fNotes");
    var notes = notesEl ? notesEl.value.trim() : "";

    if (!amount || amount <= 0) { showToast("Enter an amount greater than zero."); return; }

    var editingTx = editingTxId ? state.transactions.find(function (t) { return t.id === editingTxId; }) : null;
    function readRecurringField() {
      var el = sheet.querySelector("#fRecurring");
      if (!el || !el.checked) return null;
      var freq = sheet.querySelector("#fRecurringFrequency").value;
      var existing = editingTx && editingTx.recurring;
      if (existing && existing.active && existing.frequency === freq && existing.nextDate) {
        return { frequency: freq, nextDate: existing.nextDate, active: true };
      }
      return { frequency: freq, nextDate: advanceRecurringDate(date, freq), active: true };
    }
    function saveTx(newTx) {
      // updatedAt is what a two-sided merge uses to pick a winner when the
      // same transaction id was independently changed on two devices - see
      // reconcileState(). It has to be set on every create AND every edit,
      // here at the one place both paths pass through.
      newTx.updatedAt = Date.now();
      if (editingTx) {
        // Merge onto the existing record rather than replacing it outright -
        // the single-leg edit form only knows about its own fields, so a
        // flat replace silently dropped anything it doesn't surface (most
        // notably splitGroupId, which unlinked an edited leg from its split
        // and collapsed it to a regular standalone entry).
        newTx = Object.assign({}, editingTx, newTx);
        newTx.id = editingTx.id;
        newTx.createdAt = editingTx.createdAt;
        var idx = state.transactions.findIndex(function (t) { return t.id === editingTx.id; });
        if (idx !== -1) state.transactions[idx] = newTx;
      } else {
        newTx.id = uid();
        newTx.createdAt = Date.now();
        state.transactions.push(newTx);
      }
      return newTx;
    }

    if (txTab === "income") {
      var accountId = sheet.querySelector("#fAccount").value;
      var pending = sheet.querySelector("#fPending").checked;
      var historical = sheet.querySelector("#fHistorical").checked;
      var materialsFieldEl = sheet.querySelector("#fMaterials");
      var materialsCost = materialsFieldEl ? round2(Math.max(0, parseFloat(materialsFieldEl.value) || 0)) : 0;
      if (materialsCost > amount) { showToast("Materials cost can't exceed the total amount."); return; }
      var realRevenue = round2(amount - materialsCost);
      var sum = capSum();
      if (sum <= 0) { showToast("Set bucket CAP % in Settings first."); return; }
      var split = computeIncomeSplit(realRevenue);

      var reverted = editingTx ? undoIncomeMilestoneEffect(editingTx) : 0;
      var savedIncome = saveTx({ type: "income", date: date, description: desc, notes: notes, amount: amount, materialsCost: materialsCost, accountId: accountId, split: split, pending: pending, historical: historical, recurring: readRecurringField() });
      var msApplied = checkMilestoneSteps(realRevenue, savedIncome.id);

      var msg = editingTx ? "Income updated." : "Income logged.";
      if (msApplied > 0) msg += " " + msApplied + " CAP step" + (msApplied === 1 ? "" : "s") + " applied.";
      if (editingTx && reverted) msg += " (" + reverted + " prior step" + (reverted === 1 ? "" : "s") + " reversed.)";
      showToast(msg);
    } else if (txTab === "expense") {
      var expenseBucketId = sheet.querySelector("#fBucket").value;
      var expenseBucket = bucketById(expenseBucketId);
      var expHistorical = sheet.querySelector("#fHistorical").checked;
      var expSplitToggle = sheet.querySelector("#fExpenseSplit");
      if (!editingTx && expSplitToggle && expSplitToggle.checked) {
        var expSplit = readSplitRows(sheet, "Expense", amount);
        if (!expSplit.valid) { showToast("Split amounts must add up to the total, across at least 2 accounts."); return; }
        var expSplitNow = Date.now();
        var expSplitGroupId = uid();
        expSplit.rows.forEach(function (row, i) {
          state.transactions.push({
            id: uid(), type: "expense", date: date,
            description: desc || "Expense",
            notes: notes, amount: row.amount, bucketId: expenseBucketId, accountId: row.accountId,
            affectsBucket: true, affectsAccount: true, historical: expHistorical,
            splitGroupId: expSplitGroupId, createdAt: expSplitNow + i
          });
        });
        persist();
        closeTxSheet();
        render();
        showToast("Expense split across " + expSplit.rows.length + " accounts.");
        return;
      }
      var diffToggle = sheet.querySelector("#fDiffAccount");
      var expenseAccountId = (diffToggle && diffToggle.checked) ? sheet.querySelector("#fAccount").value : effectiveBucketAccountId(expenseBucket);
      saveTx({ type: "expense", date: date, description: desc, notes: notes, amount: amount, bucketId: expenseBucketId, accountId: expenseAccountId, affectsBucket: true, affectsAccount: true, historical: expHistorical, recurring: readRecurringField() });

      if (!editingTx) {
        var expFeeToggle = sheet.querySelector("#fExpenseFee");
        if (expFeeToggle && expFeeToggle.checked) {
          var expFeeAmount = round2(Math.max(0, parseFloat(sheet.querySelector("#fExpenseFeeAmount").value) || 0));
          var expFeeAccountId = sheet.querySelector("#fExpenseFeeAccount").value;
          if (expFeeAmount > 0 && expFeeAccountId && bucketById("opex")) {
            state.transactions.push({ id: uid(), type: "expense", date: date, description: "Wire fee — " + (desc || "expense"), amount: expFeeAmount, bucketId: "opex", accountId: expFeeAccountId, affectsBucket: true, affectsAccount: true, historical: expHistorical, createdAt: Date.now() + 1 });
          }
        }
      }
      showToast(editingTx ? "Expense updated." : "Expense logged.");
    } else if (txTab === "payout") {
      var payoutBucketId = sheet.querySelector("#fBucket").value;
      var payoutBucket = bucketById(payoutBucketId);
      var destRaw0 = sheet.querySelector("#fDestination").value;
      var payoutSplitToggle = sheet.querySelector("#fPayoutSplit");
      if (!editingTx && payoutSplitToggle && payoutSplitToggle.checked) {
        var paySplit = readSplitRows(sheet, "Payout", amount);
        if (!paySplit.valid) { showToast("Split amounts must add up to the total, across at least 2 accounts."); return; }
        var paySplitToAccountId = null, paySplitToBucketId = null;
        if (destRaw0.indexOf("account:") === 0) paySplitToAccountId = destRaw0.slice(8);
        else if (destRaw0.indexOf("bucket:") === 0) { paySplitToBucketId = destRaw0.slice(7); paySplitToAccountId = effectiveBucketAccountId(bucketById(paySplitToBucketId)); }
        var paySplitNow = Date.now();
        var paySplitGroupId = uid();
        paySplit.rows.forEach(function (row, i) {
          state.transactions.push({
            id: uid(), type: "payout", date: date,
            description: desc || "Payout",
            notes: notes, amount: row.amount, bucketId: payoutBucketId,
            toAccountId: paySplitToAccountId, toBucketId: paySplitToBucketId, fromAccountId: row.accountId,
            splitGroupId: paySplitGroupId, createdAt: paySplitNow + i
          });
        });
        persist();
        closeTxSheet();
        render();
        showToast("Payout split across " + paySplit.rows.length + " accounts.");
        return;
      }
      var payoutBucketSplitToggle = sheet.querySelector("#fPayoutBucketSplit");
      if (!editingTx && payoutBucketSplitToggle && payoutBucketSplitToggle.checked) {
        var bucketSplit = readSplitBucketRows(sheet, amount);
        if (!bucketSplit.valid) { showToast("Split amounts must add up to the total, across at least 2 buckets."); return; }
        var bsToAccountId = null, bsToBucketId = null;
        if (destRaw0.indexOf("account:") === 0) bsToAccountId = destRaw0.slice(8);
        else if (destRaw0.indexOf("bucket:") === 0) { bsToBucketId = destRaw0.slice(7); bsToAccountId = effectiveBucketAccountId(bucketById(bsToBucketId)); }
        var bsGroupId = uid();
        var bsNow = Date.now();
        bucketSplit.rows.forEach(function (row, i) {
          state.transactions.push({
            id: uid(), type: "payout", date: date,
            description: desc || "Payout",
            notes: notes, amount: row.amount, bucketId: row.bucketId,
            toAccountId: bsToAccountId, toBucketId: bsToBucketId,
            fromAccountId: effectiveBucketAccountId(bucketById(row.bucketId)),
            splitGroupId: bsGroupId, createdAt: bsNow + i
          });
        });
        persist();
        closeTxSheet();
        render();
        showToast("Payout split across " + bucketSplit.rows.length + " buckets.");
        return;
      }
      var payoutDiffToggle = sheet.querySelector("#fPayoutDiffAccount");
      var fromAccountId = (payoutDiffToggle && payoutDiffToggle.checked)
        ? sheet.querySelector("#fFromAccount").value
        : effectiveBucketAccountId(payoutBucket);
      var destRaw = destRaw0;
      var toAccountId = null, toBucketId = null;
      if (destRaw.indexOf("account:") === 0) {
        toAccountId = destRaw.slice(8);
      } else if (destRaw.indexOf("bucket:") === 0) {
        toBucketId = destRaw.slice(7);
        toAccountId = effectiveBucketAccountId(bucketById(toBucketId));
      }
      saveTx({ type: "payout", date: date, description: desc, notes: notes, amount: amount, bucketId: payoutBucketId, toAccountId: toAccountId, toBucketId: toBucketId, fromAccountId: fromAccountId });

      if (!editingTx) {
        var feeToggleEl = sheet.querySelector("#fFee");
        if (feeToggleEl && feeToggleEl.checked) {
          var feeAmount = round2(Math.max(0, parseFloat(sheet.querySelector("#fFeeAmount").value) || 0));
          var feeAccountId = sheet.querySelector("#fFeeAccount").value;
          if (feeAmount > 0 && feeAccountId && bucketById("opex")) {
            state.transactions.push({ id: uid(), type: "expense", date: date, description: "Wire fee — " + (desc || "payout"), amount: feeAmount, bucketId: "opex", accountId: feeAccountId, affectsBucket: true, affectsAccount: true, createdAt: Date.now() + 1 });
          }
        }
      }
      showToast(editingTx ? "Payout updated." : "Payout logged.");
    } else if (txTab === "move") {
      var moveFromId = sheet.querySelector("#fMoveFrom").value;
      var moveToId = sheet.querySelector("#fMoveTo").value;
      if (moveFromId === moveToId) { showToast("Pick two different buckets."); return; }
      saveTx({
        type: "payout", date: date, description: desc, notes: notes, amount: amount,
        bucketId: moveFromId, toBucketId: moveToId,
        fromAccountId: null, toAccountId: null
      });
      showToast(editingTx ? "Move updated." : "Moved.");
    } else if (txTab === "transfer") {
      var fromId = sheet.querySelector("#fFrom").value;
      var toId = sheet.querySelector("#fTo").value;
      if (fromId === toId) { showToast("Pick two different accounts."); return; }
      saveTx({ type: "transfer", date: date, description: desc, notes: notes, amount: amount, accountId: fromId, toAccountId: toId });

      if (!editingTx) {
        var transferFeeToggleEl = sheet.querySelector("#fTransferFee");
        if (transferFeeToggleEl && transferFeeToggleEl.checked) {
          var transferFeeAmount = round2(Math.max(0, parseFloat(sheet.querySelector("#fTransferFeeAmount").value) || 0));
          var transferFeeAccountId = sheet.querySelector("#fTransferFeeAccount").value;
          if (transferFeeAmount > 0 && transferFeeAccountId && bucketById("opex")) {
            state.transactions.push({ id: uid(), type: "expense", date: date, description: "Wire fee — " + (desc || "transfer"), amount: transferFeeAmount, bucketId: "opex", accountId: transferFeeAccountId, affectsBucket: true, affectsAccount: true, createdAt: Date.now() + 1 });
          }
        }
      }
      showToast(editingTx ? "Transfer updated." : "Transfer logged.");
    }

    persist();
    closeTxSheet();
    render();
  }

  function moveAccount(id, dir) {
    var idx = state.accounts.findIndex(function (a) { return a.id === id; });
    if (idx === -1) return;
    var target = dir === "up" ? idx - 1 : idx + 1;
    if (target < 0 || target >= state.accounts.length) return;
    var tmp = state.accounts[idx];
    state.accounts[idx] = state.accounts[target];
    state.accounts[target] = tmp;
    persist();
    renderSettingsSheet();
    render();
  }

  function confirmAllPending() {
    var any = false;
    var now = Date.now();
    state.transactions.forEach(function (t) { if (t.type === "income" && t.pending) { t.pending = false; t.updatedAt = now; any = true; } });
    if (!any) { showToast("Nothing pending."); return; }
    persist(); render();
    showToast("All pending income confirmed.");
  }

  /* ---------------- bucket grid actions ---------------- */
  function handleBucketGridClick(e) {
    if (e.target.closest('[data-action="distribute"]')) { openDistributeSheet(); return; }
    if (e.target.closest('[data-action="confirm-all"]')) { confirmAllPending(); return; }
    var infoBtn = e.target.closest('[data-info-tier]');
    if (infoBtn) { showToast(TIER_INFO[infoBtn.getAttribute("data-info-tier")] || ""); return; }
  }
  document.getElementById("bucketGrid").addEventListener("click", handleBucketGridClick);
  // Secondary buckets render into their own container (see renderBuckets) -
  // kept out of #frozenTop on purpose, but still needs the same actions
  // (right now just its "i" info-dot).
  document.getElementById("secondaryBucketGrid").addEventListener("click", handleBucketGridClick);

  /* ---------------- ledger actions ---------------- */
  document.getElementById("ledgerSection").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    var action = btn.getAttribute("data-action");
    var tx = state.transactions.find(function (t) { return t.id === id; });
    if (!tx) return;

    if (action === "confirm") {
      tx.pending = false;
      tx.updatedAt = Date.now();
      persist(); render();
      showToast("Marked confirmed.");
    } else if (action === "delete") {
      if (tx.splitGroupId) {
        deleteSplitGroup(tx.splitGroupId).then(function (ok) { if (ok) render(); });
        return;
      }
      openConfirm("Delete this transaction? This can't be undone.", "Delete", true).then(function (ok) {
        if (!ok) return;
        state.transactions = state.transactions.filter(function (t) { return t.id !== id; });
        // Record a tombstone so this deletion survives a stale device that
        // hasn't synced yet - without this, that device's next save would
        // silently push its still-has-the-old-entry copy back and undo the
        // delete. See syncFromServer() for the other half of this.
        if (!state.deletedTransactionIds) state.deletedTransactionIds = [];
        if (state.deletedTransactionIds.indexOf(id) === -1) state.deletedTransactionIds.push(id);
        var reverted = undoIncomeMilestoneEffect(tx);
        persist(); render();
        showToast(reverted
          ? "Transaction deleted. " + reverted + " CAP step" + (reverted === 1 ? "" : "s") + " reversed."
          : "Transaction deleted.");
      });
    } else if (action === "edit") {
      if (tx.splitGroupId) { openEditSplitGroupSheet(tx.splitGroupId); return; }
      openEditTxSheet(tx);
    }
  });

  /* ---------------- settings sheet ---------------- */
  function openSettingsSheet() {
    document.getElementById("settingsOverlay").classList.add("open");
    renderSettingsSheet();
    // Delayed to clear the sheet's own open transition (transform scale,
    // .2s) - starting the tour mid-transition would measure section rects
    // at their not-yet-settled scaled size/position.
    if (!tourSeen("settings")) setTimeout(startSettingsTour, 350);
  }
  function closeSettingsSheet() { document.getElementById("settingsOverlay").classList.remove("open"); render(); }

  function renderSettingsSheet() {
    var sheet = document.getElementById("settingsSheet");
    var cSum = capSum(), tSum = tapSum();

    var html = '<div class="sheet-head"><h3>Settings</h3><div style="display:flex; align-items:center; gap:6px;">' +
      (syncEnabled() ? '<button class="icon-btn" id="setBugReportBtn" aria-label="Report a bug" title="Report a bug">' + bugIcon() + '</button>' : '') +

      '<button class="icon-btn" id="setClose" aria-label="Close">' + xIcon() + '</button>' +
    '</div></div>';

    html += '<div class="settings-section" id="settingsSectionBusiness"><h4>Business</h4>' +
      '<div class="field"><label>Name</label><input class="input" id="sBusiness" value="' + esc(state.business) + '"></div>' +
      '<div class="field"><label>Currency label</label><input class="input" id="sCurrency" value="' + esc(state.currency) + '" style="max-width:120px"></div>' +
      '<label class="check-row"><input type="checkbox" id="sTrackMaterials"' + (state.trackMaterials ? " checked" : "") + '> Materials pass-through</label><div class="check-note">This business pays vendors/subcontractors pass-through costs — excluded from Real Revenue before splitting.</div>' +
      '</div>';

    html += '<div class="settings-section" id="settingsSectionAssessment"><h4>Instant Assessment</h4>' +
      '<div class="ledger-note" style="margin-bottom:10px">Calculate your real starting CAP from actual historical numbers instead of guessing.</div>' +
      '<button class="btn" id="openAssess">Run Instant Assessment</button>' +
    '</div>';

    html += '<div class="settings-section" id="settingsSectionTierPreset"><h4>Revenue-tier Goal preset</h4>' +
      '<div class="field"><label>Pick your Real Revenue band</label>' +
        '<select class="select" id="tapPresetSelect">' + REVENUE_TIERS.map(function (t, i) {
          return '<option value="' + i + '">' + esc(t.label) + '  —  ' + t.profit + '/' + t.ownerspay + '/' + t.tax + '/' + t.opex + '%</option>';
        }).join("") + '</select>' +
      '</div>' +
      '<button class="btn" id="applyTapPreset">Apply as Goal (TAP)</button>' +
      '<div class="ledger-note" style="margin-top:8px">From the book\'s published Target Allocation table (Profit / Owner\'s Pay / Tax / Opex). Sets Goal % only — your current CAP% is untouched.</div>' +
    '</div>';

    html += '<div class="settings-section" id="settingsSectionDebt"><h4>Debt</h4>' +
      '<div class="field"><label>Company debt remaining (optional)</label><input class="input" type="number" step="0.01" min="0" id="sDebt" value="' + (state.companyDebt || 0) + '"></div>' +
      '<div class="ledger-note">Per the book: as long as this is above zero, distributing from the Profit bucket sends 100% to debt paydown first — the normal owner-bonus split resumes automatically once it hits zero. Leave at 0 if there\'s no real company debt (arrears and personal debt don\'t count).</div>' +
    '</div>';

    html += '<div class="settings-section" id="settingsSectionDistribution"><h4>Distribution</h4>' +
      '<div class="field"><label>Distribution cadence</label><select class="select" id="sCadence">' +
        '<option value="quarterly"' + (state.distributionCadence !== "annual" ? " selected" : "") + '>Quarterly</option>' +
        '<option value="annual"' + (state.distributionCadence === "annual" ? " selected" : "") + '>Annual</option>' +
      '</select></div>' +
      '<div class="field"><label>Fiscal year begins (repeats every year)</label>' +
        '<div class="row2">' +
          '<select class="select" id="sFiscalMonth">' + MONTHS.map(function (m, i) {
            return '<option value="' + (i + 1) + '"' + ((i + 1) === parseInt((state.fiscalYearStart || "01-01").split("-")[0], 10) ? " selected" : "") + '>' + m + '</option>';
          }).join("") + '</select>' +
          '<select class="select" id="sFiscalDay">' + Array.from({ length: 31 }, function (_, i) { return i + 1; }).map(function (d) {
            return '<option value="' + d + '"' + (d === parseInt((state.fiscalYearStart || "01-01").split("-")[1], 10) ? " selected" : "") + '>' + d + '</option>';
          }).join("") + '</select>' +
        '</div>' +
      '</div>' +
      '<div class="ledger-note">Distribute becomes available exactly 91 days (or 365 for annual) after the fiscal start above, or after your last distribution — and stays available until you actually distribute, it doesn\'t hide itself again. Splits Profit 50/50 between owners and Vault (100% to debt first, if any is on file).</div>' +
    '</div>';

    html += '<div class="settings-section" id="settingsSectionOwners"><h4>Owners</h4>';
    var owners = state.owners || [];
    html += owners.map(function (o) {
      return '<div class="acct-edit-row" data-owner="' + o.id + '">' +
        '<div class="acct-edit-top">' +
          '<input class="input" data-field="name" value="' + esc(o.name) + '" placeholder="Owner name">' +
          '<button class="del-btn" data-del-owner="' + o.id + '" aria-label="Remove owner">' + xIcon() + '</button>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="pct-field"><label>Ownership</label><div class="pct-input-wrap"><input class="input pct" data-field="pct" type="number" step="1" min="0" value="' + o.pct + '"><span class="pct-suffix">%</span></div></div>' +
          '<div class="field"><label>Account</label><select class="select" data-field="accountId"><option value="">— pick account —</option>' + accountOptions(o.accountId) + '</select></div>' +
        '</div>' +
      '</div>';
    }).join("");
    var ownerPctSum = owners.reduce(function (s, o) { return s + (Number(o.pct) || 0); }, 0);
    html += '<button class="add-row-btn" id="addOwner">+ Add owner</button>';
    if (owners.length) {
      html += '<div class="sum-note ' + (round2(ownerPctSum) === 100 ? "ok" : "bad") + '" id="ownerSumNote">Ownership total: ' + round2(ownerPctSum) + '%' + (round2(ownerPctSum) === 100 ? " — splits nicely into 100%" : " — should add up to 100% or Distribute\'s auto-split will be off") + '</div>';
    }
    html += '<div class="ledger-note" style="margin-top:8px">When at least one owner is set up, Distribute auto-splits the bonus portion by these percentages, one payout per owner. With no owners configured, Distribute falls back to a manual pick from your Personal-type accounts.</div>';
    html += '</div>';

    var primaryBucketsForSettings = state.buckets.filter(function (b) { return b.tier !== "secondary"; });
    var secondaryBucketsForSettings = state.buckets.filter(function (b) { return b.tier === "secondary"; });

    function bucketSettingsGroup(buckets, otherLabel, otherKey, showPct) {
      if (!buckets.length) return '<div class="ledger-note" style="margin:4px 0 8px">No buckets here yet.</div>';
      var header = showPct ? '<div class="bucket-edit-header"><span style="flex:1"></span><span style="flex:0 0 84px; text-align:right;">CAP</span><span style="flex:0 0 84px; text-align:right;">TAP</span><span style="width:30px"></span></div>' : "";
      var rows = buckets.map(function (b) {
        var pctHtml = showPct ?
          '<div class="pct-input-wrap" style="flex:0 0 84px"><input class="input pct" data-field="cap" type="number" step="1" value="' + b.cap + '"><span class="pct-suffix">%</span></div>' +
          '<div class="pct-input-wrap" style="flex:0 0 84px"><input class="input pct" data-field="tap" type="number" step="1" value="' + b.tap + '"><span class="pct-suffix">%</span></div>'
          : "";
        return '<div class="bucket-edit-row" data-bucket="' + b.id + '">' +
          '<div class="bucket-edit-line">' +
            '<input class="input" data-field="name" value="' + esc(b.name) + '" placeholder="Name">' +
            pctHtml +
            '<button class="del-btn" data-del-bucket="' + b.id + '" aria-label="Remove bucket">' + xIcon() + '</button>' +
          '</div>' +
          '<div class="row2" style="margin-top:8px">' +
            '<div class="field"><label>Linked account</label><select class="select" data-field="linkedAccountId"><option value="">Virtual (shared)</option>' + accountOptions(b.linkedAccountId) + '</select></div>' +
            '<div class="field"><label>&nbsp;</label><button class="link-btn" data-move-bucket="' + b.id + '" data-move-to="' + otherKey + '">→ Move to ' + otherLabel + '</button></div>' +
          '</div>' +
        '</div>';
      }).join("");
      return header + rows;
    }

    html += '<div class="settings-section" id="settingsSectionBuckets"><h4>Buckets</h4>';
    html += '<details class="bucket-tier-group" open>' +
      '<summary>Primary <span class="bucket-tier-explain">— everyday accounts</span></summary>' +
      bucketSettingsGroup(primaryBucketsForSettings, "Secondary", "secondary", true) +
      '<button class="add-row-btn" data-add-bucket-tier="primary">+ Add Primary bucket</button>' +
    '</details>';
    html += '<details class="bucket-tier-group">' +
      '<summary>Secondary <span class="bucket-tier-explain">— hard-to-touch accounts</span></summary>' +
      bucketSettingsGroup(secondaryBucketsForSettings, "Primary", "primary", false) +
      '<button class="add-row-btn" data-add-bucket-tier="secondary">+ Add Secondary bucket</button>' +
    '</details>';
    html += '<div class="sum-note ' + (cSum === 100 ? "ok" : "bad") + '">CAP total: ' + cSum + '%' + (cSum === 100 ? " — splits nicely into 100%" : " — should add up to 100% or splits will be off") + '</div>';
    html += '<div class="sum-note ' + (tSum === 100 ? "ok" : "bad") + '">Goal (TAP) total: ' + tSum + '%' + (tSum === 100 ? "" : " — target percentages usually add up to 100%") + '</div>';
    html += '</div>';

    html += '<div class="settings-section" id="settingsSectionMilestones"><h4>Milestone pacing</h4>' +
      '<div class="field"><label>Milestone mode</label><select class="select" id="milestoneModeSelect">' +
        '<option value="amount"' + (state.milestoneMode !== "percent" ? " selected" : "") + '>Flat amount</option>' +
        '<option value="percent"' + (state.milestoneMode === "percent" ? " selected" : "") + '>% of this month\'s Real Revenue</option>' +
      '</select></div>' +
      '<div class="field" id="milestoneAmountField" style="' + (state.milestoneMode === "percent" ? "display:none" : "") + '"><label>Milestone amount (per calendar month)</label><input class="input" type="number" step="1" min="0" id="milestoneAmountInput" value="' + (state.milestoneAmount != null ? state.milestoneAmount : 100000) + '"></div>' +
      '<div class="field" id="milestonePercentField" style="' + (state.milestoneMode === "percent" ? "" : "display:none") + '"><label>Milestone (% of this month\'s Real Revenue)</label><input class="input" type="number" step="0.1" min="0" id="milestonePercentInput" value="' + (state.milestonePercent != null ? state.milestonePercent : 5) + '"></div>' +
      '<div class="ledger-note">Every time Real Revenue logged within the current calendar month crosses another full milestone, one CAP point moves automatically — no button to press. Resets on the 1st of each month. Each step moves one point from a bucket already above its own TAP to a bucket still below its own TAP (priority Profit → Owner\'s Pay → Tax → Opex).</div>' +
    '</div>';

    html += '<div class="settings-section" id="settingsSectionAccounts"><h4>Bank Accounts</h4><div class="ledger-note" style="margin-top:-6px">Use the arrows to reorder — this order sets the display order everywhere (dashboard, dropdowns).</div>';
    html += state.accounts.map(function (a, idx) {
      var type = a.type || "company";
      var isDefault = a.id === state.defaultAccountId || (!state.defaultAccountId && state.accounts[0] && state.accounts[0].id === a.id);
      return '<div class="acct-edit-row" data-account="' + a.id + '">' +
        '<div class="acct-edit-top">' +
          '<div class="reorder-btns">' +
            '<button class="reorder-btn" data-move-account="' + a.id + '" data-dir="up" aria-label="Move up"' + (idx === 0 ? " disabled" : "") + '>' + upIcon() + '</button>' +
            '<button class="reorder-btn" data-move-account="' + a.id + '" data-dir="down" aria-label="Move down"' + (idx === state.accounts.length - 1 ? " disabled" : "") + '>' + downIcon() + '</button>' +
          '</div>' +
          '<label class="default-radio"><input type="radio" name="defaultAccountRadio" value="' + a.id + '"' + (isDefault ? " checked" : "") + '> Default</label>' +
          '<input class="input" data-field="name" value="' + esc(a.name) + '" placeholder="Account name">' +
          '<button class="del-btn" data-del-account="' + a.id + '" aria-label="Remove account">' + xIcon() + '</button>' +
        '</div>' +
        '<div class="row2">' +
          '<select class="select" data-field="type">' + ACCOUNT_TYPES.map(function (t) {
            return '<option value="' + t.key + '"' + (type === t.key ? " selected" : "") + '>' + t.label + '</option>';
          }).join("") + '</select>' +
          '<input class="input" data-field="status" value="' + esc(a.status || "") + '" placeholder="Status badge (optional)">' +
        '</div>' +
      '</div>';
    }).join("");
    html += '<div class="btn-row"><button class="add-row-btn" id="addAccount">+ Add account</button><button class="btn" id="openObBtn">Add Opening Balance</button></div></div>';

    html += '<hr class="div">';
    html += '<div class="settings-section" id="settingsSectionData"><h4>Data</h4>' +
      '<div class="btn-row"><button class="btn" id="exportBtn">Export backup</button><button class="btn" id="importBtn">Import backup</button></div>' +
      '<input type="file" id="importFile" accept="application/json,.json">' +
      '<button class="btn btn-danger" id="resetBtn" style="margin-top:10px">Reset all data</button>' +
      '</div>';

    sheet.innerHTML = html;
    wireSettingsSheet();
  }

  function wireSettingsSheet() {
    var sheet = document.getElementById("settingsSheet");
    sheet.querySelector("#setClose").addEventListener("click", closeSettingsSheet);
    sheet.querySelector("#setHelpBtn").addEventListener("click", startSettingsTour);
    var bugReportBtn = sheet.querySelector("#setBugReportBtn");
    if (bugReportBtn) bugReportBtn.addEventListener("click", openBugReportSheet);

    sheet.querySelector("#sBusiness").addEventListener("input", function (e) { state.business = e.target.value; persist(); document.getElementById("brandName").textContent = state.business || "Company Tracker"; });
    sheet.querySelector("#sCurrency").addEventListener("input", function (e) { state.currency = e.target.value; persist(); });
    sheet.querySelector("#sTrackMaterials").addEventListener("change", function (e) { state.trackMaterials = e.target.checked; persist(); });
    sheet.querySelector("#openAssess").addEventListener("click", openAssessSheet);
    sheet.querySelector("#applyTapPreset").addEventListener("click", function () {
      var idx = parseInt(sheet.querySelector("#tapPresetSelect").value, 10);
      var tier = REVENUE_TIERS[idx];
      if (!tier) return;
      var map = { profit: tier.profit, ownerspay: tier.ownerspay, tax: tier.tax, opex: tier.opex };
      var matched = state.buckets.filter(function (b) { return map.hasOwnProperty(b.id); });
      if (!matched.length) { showToast("No Profit / Owner's Pay / Tax / Opex buckets found to update."); return; }
      openConfirm("Set Goal (TAP) to the " + tier.label + " tier — Profit " + tier.profit + "%, Owner's Pay " + tier.ownerspay + "%, Tax " + tier.tax + "%, Opex " + tier.opex + "%? This only changes your target, not your current CAP%.", "Apply", false).then(function (ok) {
        if (!ok) return;
        matched.forEach(function (b) { b.tap = map[b.id]; });
        persist();
        renderSettingsSheet();
        showToast("Goal (TAP) set to the " + tier.label + " tier.");
      });
    });
    sheet.querySelector("#sDebt").addEventListener("input", function (e) { state.companyDebt = Math.max(0, parseFloat(e.target.value) || 0); persist(); });
    sheet.querySelector("#sCadence").addEventListener("change", function (e) { state.distributionCadence = e.target.value; persist(); render(); });
    var updateFiscalStart = function () {
      var m = parseInt(sheet.querySelector("#sFiscalMonth").value, 10);
      var d = parseInt(sheet.querySelector("#sFiscalDay").value, 10);
      state.fiscalYearStart = String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      state.distributionAnchorOverride = null;
      persist();
      render();

      if (!mostRecentDistributionDate() && distributionDue()) {
        var periodEndMs = fiscalAnchorDate().getTime() + distributionCadenceDays() * 86400000;
        var periodEndStr = shortDate(dateToStr(new Date(periodEndMs)));
        openChoice(
          "Based on this fiscal year start, a distribution period ending " + periodEndStr + " already looks overdue. Distribute for that period now, or skip it and start counting from today?",
          "Distribute now", "Start next cycle"
        ).then(function (choice) {
          if (choice === "A") {
            openDistributeSheet();
          } else if (choice === "B") {
            state.distributionAnchorOverride = todayStr();
            persist();
            render();
            renderSettingsSheet();
          }
        });
      }
    };
    sheet.querySelector("#sFiscalMonth").addEventListener("change", updateFiscalStart);
    sheet.querySelector("#sFiscalDay").addEventListener("change", updateFiscalStart);
    sheet.querySelectorAll('input[name="defaultAccountRadio"]').forEach(function (radio) {
      radio.addEventListener("change", function (e) {
        state.defaultAccountId = e.target.value;
        persist();
        render();
        renderSettingsSheet();
      });
    });

    sheet.querySelectorAll("[data-owner]").forEach(function (row) {
      var id = row.getAttribute("data-owner");
      var o = (state.owners || []).find(function (ow) { return ow.id === id; });
      if (!o) return;
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function () {
          var field = inp.getAttribute("data-field");
          o[field] = field === "pct" ? (parseFloat(inp.value) || 0) : inp.value;
          persist();
          if (field === "pct") {
            var sumNote = sheet.querySelector("#ownerSumNote");
            if (sumNote) {
              var sum = round2((state.owners || []).reduce(function (s, ow) { return s + (Number(ow.pct) || 0); }, 0));
              sumNote.textContent = "Ownership total: " + sum + "%" + (sum === 100 ? " — splits nicely into 100%" : " — should add up to 100% or Distribute's auto-split will be off");
              sumNote.className = "sum-note " + (sum === 100 ? "ok" : "bad");
            }
          }
          if (evt === "change") { renderSettingsSheet(); }
        });
      });
    });
    sheet.querySelectorAll("[data-del-owner]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-owner");
        state.owners = (state.owners || []).filter(function (o) { return o.id !== id; });
        persist(); renderSettingsSheet();
      });
    });
    var addOwnerBtn = sheet.querySelector("#addOwner");
    if (addOwnerBtn) {
      addOwnerBtn.addEventListener("click", function () {
        if (!state.owners) state.owners = [];
        state.owners.push({ id: uid(), name: "New owner", pct: 0, accountId: "" });
        persist(); renderSettingsSheet();
      });
    }

    sheet.querySelectorAll(".bucket-edit-row").forEach(function (row) {
      var id = row.getAttribute("data-bucket");
      var b = bucketById(id);
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function () {
          var field = inp.getAttribute("data-field");
          if (field === "name") {
            b[field] = inp.value;
          } else if (field === "linkedAccountId") {
            b.linkedAccountId = inp.value || null;
          } else {
            b[field] = parseFloat(inp.value) || 0;
          }
          persist();
          if (field === "cap" || field === "tap") {
            var noteEls = sheet.querySelectorAll(".sum-note");
            if (noteEls[0]) { var cs = capSum(); noteEls[0].textContent = "CAP total: " + cs + "%" + (cs === 100 ? " — splits nicely into 100%" : " — should add up to 100% or splits will be off"); noteEls[0].className = "sum-note " + (cs === 100 ? "ok" : "bad"); }
            if (noteEls[1]) { var ts = tapSum(); noteEls[1].textContent = "Goal (TAP) total: " + ts + "%" + (ts === 100 ? "" : " — target percentages usually add up to 100%"); noteEls[1].className = "sum-note " + (ts === 100 ? "ok" : "bad"); }
          }
          if (evt === "change") { render(); }
        });
      });
    });
    sheet.querySelectorAll("[data-del-bucket]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-bucket");
        if (state.buckets.length <= 1) { showToast("You need at least one bucket."); return; }
        if (bucketUsedInTx(id)) { showToast("Can't remove a bucket used in existing transactions."); return; }
        state.buckets = state.buckets.filter(function (b) { return b.id !== id; });
        persist(); renderSettingsSheet();
      });
    });
    sheet.querySelectorAll("[data-move-bucket]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-move-bucket");
        var to = btn.getAttribute("data-move-to");
        var b = bucketById(id);
        if (!b) return;
        b.tier = to;
        persist(); renderSettingsSheet();
      });
    });
    sheet.querySelectorAll("[data-add-bucket-tier]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var tier = btn.getAttribute("data-add-bucket-tier");
        state.buckets.push({ id: uid(), name: "New bucket", cap: 0, tap: 0, tier: tier, linkedAccountId: null });
        persist(); renderSettingsSheet();
      });
    });

    var milestoneModeSelect = sheet.querySelector("#milestoneModeSelect");
    if (milestoneModeSelect) {
      milestoneModeSelect.addEventListener("change", function (e) {
        state.milestoneMode = e.target.value;
        persist();
        var amtField = sheet.querySelector("#milestoneAmountField");
        var pctField = sheet.querySelector("#milestonePercentField");
        if (amtField) amtField.style.display = state.milestoneMode === "percent" ? "none" : "";
        if (pctField) pctField.style.display = state.milestoneMode === "percent" ? "" : "none";
        render();
      });
    }
    var milestoneAmountInput = sheet.querySelector("#milestoneAmountInput");
    if (milestoneAmountInput) milestoneAmountInput.addEventListener("input", function (e) { state.milestoneAmount = Math.max(0, parseFloat(e.target.value) || 0); persist(); render(); });
    var milestonePercentInput = sheet.querySelector("#milestonePercentInput");
    if (milestonePercentInput) milestonePercentInput.addEventListener("input", function (e) { state.milestonePercent = Math.max(0, parseFloat(e.target.value) || 0); persist(); render(); });

    sheet.querySelectorAll(".acct-edit-row").forEach(function (row) {
      var id = row.getAttribute("data-account");
      var a = accountById(id);
      row.querySelectorAll("[data-field]").forEach(function (inp) {
        var evt = inp.tagName === "SELECT" ? "change" : "input";
        inp.addEventListener(evt, function () {
          a[inp.getAttribute("data-field")] = inp.value;
          persist();
          if (evt === "change") { render(); }
        });
      });
    });
    sheet.querySelectorAll("[data-del-account]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-account");
        if (id === CASH_ACCOUNT_ID) { showToast("Cash on hand can't be removed."); return; }
        if (accountUsedInTx(id)) { showToast("Can't remove an account used in existing transactions."); return; }
        if (accountLinkedToBucket(id)) { showToast("Can't remove an account linked to a bucket — unlink it first."); return; }
        state.accounts = state.accounts.filter(function (a) { return a.id !== id; });
        persist(); renderSettingsSheet();
      });
    });
    sheet.querySelectorAll("[data-move-account]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        moveAccount(btn.getAttribute("data-move-account"), btn.getAttribute("data-dir"));
      });
    });
    var openObBtn = sheet.querySelector("#openObBtn");
    if (openObBtn) openObBtn.addEventListener("click", function () { openObSheet(); });
    sheet.querySelector("#addAccount").addEventListener("click", function () {
      var newAccount = { id: uid(), name: "New account", status: "", type: "company" };
      var cashIdx = state.accounts.findIndex(function (a) { return a.id === CASH_ACCOUNT_ID; });
      if (cashIdx === -1) state.accounts.push(newAccount);
      else state.accounts.splice(cashIdx, 0, newAccount);
      persist(); renderSettingsSheet();
    });

    sheet.querySelector("#exportBtn").addEventListener("click", handleExport);
    sheet.querySelector("#importBtn").addEventListener("click", function () { sheet.querySelector("#importFile").click(); });
    sheet.querySelector("#importFile").addEventListener("change", handleImport);
    sheet.querySelector("#resetBtn").addEventListener("click", handleReset);
  }

  /* ---------------- bug report popup ---------------- */
  // A report has nowhere to go without the backend it POSTs to, and the
  // trigger button is only rendered in Settings' header when syncEnabled()
  // anyway - so this is never opened in sync-disabled mode.
  function openBugReportSheet() {
    document.getElementById("bugReportOverlay").classList.add("open");
    renderBugReportSheet();
  }
  function closeBugReportSheet() {
    document.getElementById("bugReportOverlay").classList.remove("open");
  }

  function renderBugReportSheet() {
    var sheet = document.getElementById("bugReportSheet");
    sheet.innerHTML =
      '<div class="sheet-head"><h3>Report a bug</h3><button class="icon-btn" id="bugReportClose" aria-label="Close">' + xIcon() + '</button></div>' +
      '<div class="field"><label>What happened?</label>' +
        '<textarea class="input" id="bugReportMessage" placeholder="Describe what you saw and what you expected instead" style="min-height:110px; resize:vertical" autofocus></textarea>' +
      '</div>' +
      '<button type="button" class="btn btn-primary" id="bugReportSubmit">Send</button>' +
      '<div class="ledger-note" id="bugReportNote" style="margin-top:10px; display:none"></div>';

    sheet.querySelector("#bugReportClose").addEventListener("click", closeBugReportSheet);
    sheet.querySelector("#bugReportSubmit").addEventListener("click", handleBugReportSubmit);
  }

  function handleBugReportSubmit() {
    var sheet = document.getElementById("bugReportSheet");
    var textarea = sheet.querySelector("#bugReportMessage");
    var note = sheet.querySelector("#bugReportNote");
    var btn = sheet.querySelector("#bugReportSubmit");
    var message = (textarea.value || "").trim();
    if (!message) { textarea.focus(); return; }
    btn.disabled = true;
    btn.textContent = "Sending…";
    // Just enough to place the report without being a tracking payload -
    // which business/version this came from, and the reporter's own device/
    // browser, since "it doesn't work" is otherwise unreproducible.
    var context = (state.business || "Unknown business") + " · " + (state.version || "?") + " · " + navigator.userAgent;
    fetch(SYNC_URL + "/api/bugreports", {
      method: "POST",

        btn.textContent = "Send";
        note.style.display = "";
        note.textContent = "Couldn't send that just now — check your connection and try again.";
      });
  }

  function computeAdjustedCaps(rawByBucket, buckets) {
    var list = buckets || state.buckets;
    var ids = list.map(function (b) { return b.id; });
    var absorberId = ids.indexOf("opex") !== -1 ? "opex" : null;
    if (!absorberId && ids.length) {
      var maxId = null, maxVal = -1;
      ids.forEach(function (id) { if ((rawByBucket[id] || 0) > maxVal) { maxVal = rawByBucket[id] || 0; maxId = id; } });
      absorberId = maxId;
    }
    var adjusted = {}, running = 0;
    list.forEach(function (b) {
      if (b.id === absorberId) return;
      var raw = rawByBucket[b.id] || 0;
      var val;
      if (b.id === "profit") val = raw < 1 ? 1 : Math.ceil(raw) + 1;
      else if (b.id === "ownerspay" || b.id === "tax") val = Math.ceil(raw);
      else val = Math.round(raw);
      adjusted[b.id] = val;
      running += val;
    });
    if (absorberId) adjusted[absorberId] = Math.max(0, round2(100 - running));
    return adjusted;
  }

  function assessUpdatePreview() {
    var sheet = document.getElementById("assessSheet");
    var revenue = parseFloat(sheet.querySelector("#aRevenue").value) || 0;
    var materialsEl = sheet.querySelector("#aMaterials");
    var materials = materialsEl ? (parseFloat(materialsEl.value) || 0) : 0;

    var primaryBuckets = assessPrimaryBuckets();
    var total = 0;

    primaryBuckets.forEach(function (b) {
      var el = sheet.querySelector('[data-assess-bucket="' + b.id + '"]');
      var amt = el ? (parseFloat(el.value) || 0) : 0;
      total += amt;
      rawByBucket[b.id] = realRevenue > 0 ? (amt / realRevenue * 100) : 0;
    });
    var adjusted = computeAdjustedCaps(rawByBucket, primaryBuckets);
    var adjustedSum = primaryBuckets.reduce(function (s, b) { return s + (adjusted[b.id] || 0); }, 0);

    var rows = primaryBuckets.map(function (b) {
      var raw = rawByBucket[b.id] || 0;

      return '<div class="assess-row-preview"><span>' + esc(b.name) + '</span><span class="num">' + raw.toFixed(1) + '% <strong class="assess-adjusted">→ ' + adj + '%</strong></span></div>';
    }).join("");
    var accountedPct = realRevenue > 0 ? (total / realRevenue * 100) : 0;
    sheet.querySelector("#aPreview").innerHTML = rows +
      '<div class="assess-row-preview total"><span>Accounted for (raw)</span><span class="num">' + curr() + ' ' + fmt(total) + '  ·  ' + accountedPct.toFixed(1) + '%</span></div>' +

  function distributeBreakdown() {
    var derived = computeDerived();
    var profitBalance = derived.bucketConfirmed.profit || 0;
    var debt = Math.max(0, state.companyDebt || 0);
    var debtPaid = round2(Math.min(profitBalance, debt));
    var remainder = round2(profitBalance - debtPaid);
    var hasVault = !!bucketById("vault");
    var ownerAmount = remainder > 0 ? (hasVault ? round2(remainder / 2) : remainder) : 0;
    var vaultAmount = remainder > 0 && hasVault ? round2(remainder - ownerAmount) : 0;
    return { profitBalance: profitBalance, debt: debt, debtPaid: debtPaid, remainder: remainder, ownerAmount: ownerAmount, vaultAmount: vaultAmount, hasVault: hasVault };
  }

  function handleDistributeSubmit() {
    var sheet = document.getElementById("distributeSheet");
    var b = distributeBreakdown();
    if (b.profitBalance <= 0) { showToast("Nothing in Profit to distribute."); return; }
    var fromAccountId = effectiveBucketAccountId(bucketById("profit"));
    var owners = state.owners || [];

    var payouts = [];
    if (b.debtPaid > 0) payouts.push({ description: "Profit distribution — debt paydown", amount: b.debtPaid, toAccountId: null, toBucketId: null });

    if (b.ownerAmount > 0) {
      if (owners.length) {
        var ownerSum = owners.reduce(function (s, o) { return s + (Number(o.pct) || 0); }, 0);
        if (ownerSum <= 0) { showToast("Owners need a non-zero ownership % — check Settings."); return; }
        owners.forEach(function (o) {
          var share = round2(b.ownerAmount * (Number(o.pct) || 0) / ownerSum);
          if (share > 0) payouts.push({ description: "Profit distribution — " + (o.name || "owner"), amount: share, toAccountId: o.accountId || null, toBucketId: null });
        });
      } else {
        var acctEl = sheet.querySelector("#dAccount");
        var toAccountId = acctEl ? acctEl.value : null;
        if (!toAccountId) { showToast("Add a Personal-type account, or set up owners in Settings."); return; }
        payouts.push({ description: "Profit distribution — owner bonus", amount: b.ownerAmount, toAccountId: toAccountId, toBucketId: null });
      }
    }

    if (b.vaultAmount > 0) {
      var vaultAcct = effectiveBucketAccountId(bucketById("vault"));
      payouts.push({ description: "Profit distribution — Vault reserve", amount: b.vaultAmount, toAccountId: vaultAcct, toBucketId: "vault" });
    }

    if (!payouts.length) { showToast("Nothing to distribute."); return; }

    var msg = "Distribute " + state.currency + " " + fmt(b.profitBalance) + " from Profit across " + payouts.length + " payout" + (payouts.length === 1 ? "" : "s") + "?";

    openConfirm(msg, "Distribute", false).then(function (ok) {
      if (!ok) return;
      var now = Date.now();
      payouts.forEach(function (p, i) {
        state.transactions.push({ id: uid(), type: "payout", date: todayStr(), description: p.description, amount: p.amount, bucketId: "profit", toAccountId: p.toAccountId, toBucketId: p.toBucketId, fromAccountId: fromAccountId, createdAt: now + i });
      });
      if (b.debtPaid > 0) state.companyDebt = round2(Math.max(0, b.debt - b.debtPaid));
      persist();
      closeDistributeSheet();
      render();
      showToast("Profit distributed.");
    });
  }
