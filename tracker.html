<style>
  /* Official Saudi Riyal sign (U+20C1, Unicode 17). Scoped to just that one
     codepoint via unicode-range so it never affects any other character -
     safe to sit first in every font stack below. Falls back to whatever
     glyph the system font has for U+20C1 if this CDN is unreachable. */
  @font-face {
    font-family: "saudi-riyal";
    src: url("https://cdn.jsdelivr.net/npm/@emran-alhaddad/saudi-riyal-font/fonts/regular/saudi_riyal.woff2") format("woff2"),
         url("https://cdn.jsdelivr.net/npm/@emran-alhaddad/saudi-riyal-font/fonts/regular/saudi_riyal.woff") format("woff");
    unicode-range: U+20C1;
    font-display: swap;
  }

    --paper: #F1F2EC;

    --gold: #D9AB4C;        --gold-soft: #362C16;
    --clay: #E1785C;        --clay-soft: #3A241C;
    --slate: #86A9CC;       --slate-soft: #202C38;
    --plum: #B491CC;        --plum-soft: #2B2333;
    --moss: #9CBE6E;        --moss-soft: #26301A;

    --danger: #E2685A;
    --danger-soft: #3A211D;
    --focus: #57B394;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.45;
    padding-bottom: 96px;
  }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; color: var(--ink); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .curr { font-size: 1.35em; line-height: 1; vertical-align: -0.06em; display: inline-block; }

  a { color: var(--accent); }

  /* ---------- layout ---------- */
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    max-width: var(--content-max); margin: 0 auto;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand h1 { font-size: 1.25rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .eyebrow { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); flex: 0 0 auto;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }

  /* Accounts + Buckets - NOT pinned by default, scrolls normally with
     everything else. Once scrolled down past a threshold, a subtle
     freeze-arrow fades in offering to pin it right under the topbar for
     that scroll-down session; scrolling back to the top resets to the
     unfrozen default for next time (updateFreezeUI() in the global wiring
     section), so there's no separate on/off setting to manage or get
     stuck in. --topbar-h is measured in JS (the header's height isn't
     fixed, it's padding-based) since a sticky element's `top` has to
     match whatever's already stuck above it. */
  .frozen-top { background: var(--paper); padding-bottom: 10px; position: relative; }
  .frozen-top.is-frozen {
    /* Pinned 8px (the blur radius) higher than the header's edge and tucked
       behind it (lower z-index) - two adjacent boxes each running their own
       backdrop-filter can't blur across their shared edge, so butting them
       together exactly at that edge leaves a visible seam/shadow where one
       blur abruptly cuts off and the other begins. Overlapping them by the
       blur radius hides the seam entirely behind the header - the header's
       own blur then reads a bit of this layer instead of raw scrolled
       content there, so the two blend rather than meet at a hard line. */
    position: sticky; top: calc(var(--topbar-h, 64px) - 8px); z-index: 15;
    /* Compensates the 8px pull upward above (padding, not margin - a
       child's margin-top here collapses through into the parent's own
       box and cancels the offset out; padding can't collapse). */
    padding-top: 8px;
    border-bottom: 1px solid var(--border);
    /* Same translucent-blur treatment as header.topbar, so the pinned
       block reads as one continuous glassy surface with it. */
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  /* The topbar's own bottom border becomes a redundant doubled line right
     above .frozen-top's own border once frozen - hide it only then. */
  header.topbar.frozen-active { border-bottom: none; }
  /* Sits in normal flow right after the Buckets block (a sibling of
     .frozen-top, not a child - it needs the whole rest of the page as
     its sticky containing block, not just frozenTop's own short box).
     That's what makes it travel: it starts at its natural spot right
     under Buckets and, as you scroll, rides up with the page until it
     hits `top`, then holds there for the rest of the scroll - it only
     drops back to its natural spot once you scroll back near the top.
     "Eligible" (scrolled past the threshold) just makes it hoverable;
     actually VISIBLE needs either active scrolling (.is-active-scroll,
     JS-timed) or a real :hover - so it shows while you're scrolling,
     fades after you stop, and comes back the instant the mouse rests
     where it was (touch has no hover, but a swipe keeps re-triggering
     .is-active-scroll the same way scrolling does). */
  .unfreeze-arrow {
    /* --arrow-dock-top (JS-measured, see updateArrowDockVar) is topbar-h+4
       while unfrozen, but topbar-h + the WHOLE pinned block's height once
       frozen - the block stays pinned taking up real screen space instead
       of scrolling away, so docking at the shallow unfrozen offset would
       land the arrow in the middle of the pinned content instead of below
       it. */
    position: sticky; top: var(--arrow-dock-top, 64px);
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 22px; margin: 0 auto; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    z-index: 16;
  }
  .unfreeze-arrow.eligible { pointer-events: auto; }
  .unfreeze-arrow.eligible.is-active-scroll, .unfreeze-arrow.eligible:hover { opacity: 1; }

  .stats-row {
    display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0; max-width: var(--content-max); margin: 0 auto;
  }
  .stats-row-accounts {
    display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
  }
  .stats-row-accounts::-webkit-scrollbar { display: none; }
  @media (min-width: 460px) {
    .stats-row { flex-direction: row; flex-wrap: wrap; }
    .stats-row-accounts { display: contents; }
    .stats-row-accounts .stat { flex: 0 0 calc((100% - 32px) / 5); }
  }
  .stat {
    flex: 1 1 130px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 9px 10px; min-width: 0; container-type: inline-size;
  }
  @media (max-width: 459px) {
    .stats-row-accounts .stat { flex: 1 0 30%; scroll-snap-align: start; scroll-snap-stop: always; }
  }
  .stat .label {
    font-size: clamp(0.52rem, 6.5cqw, 0.63rem); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted);
    overflow-wrap: break-word; word-break: break-word;
  }
  .stat .value {
    font-size: clamp(0.78rem, 11cqw, 1rem); font-weight: 600; margin-top: 2px;
    overflow-wrap: break-word; word-break: break-word;
  }
  .stat.total { background: var(--surface-2); width: 100%; padding: 9px 10px; flex: 0 0 auto; }
  .total-label-short { display: none; }
  @media (min-width: 460px) {
    .stat.total { width: auto; flex: 1 1 130px; }
    .stat.total .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .total-label-full { display: none; }
    .total-label-short { display: inline; }
    .total-note { font-size: 0.85em; font-weight: 400; color: var(--text-muted); opacity: 0.85; }
  }
  .acct-type-tag { font-size: 0.6rem; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.03em; }

  section.block { padding: 20px 16px 0; max-width: var(--content-max); margin: 0 auto; }
  .block h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .block h2 .sub { font-family: var(--font-body); font-weight: 400; font-size: 0.78rem; color: var(--text-muted); }

  /* ---------- bucket cards ---------- */
  .bucket-grid {
    display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
  }
  .bucket-grid::-webkit-scrollbar { display: none; }
  @media (min-width: 460px) {
    .bucket-grid { display: grid; grid-template-columns: repeat(4, 1fr); overflow-x: visible; scroll-snap-type: none; }
  }
  @media (min-width: 860px) { .bucket-grid { grid-template-columns: repeat(5, 1fr); } }

  .bucket-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    border-top: 3px solid var(--bucket-color, var(--accent));
    flex: 1 0 44%; scroll-snap-align: start; scroll-snap-stop: always;
  }
  @media (min-width: 460px) { .bucket-card { flex: initial; } }
  .bucket-name { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
  .bucket-balance { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  .pill {
    display: inline-block; font-size: 0.68rem; padding: 2px 7px; border-radius: 999px;
    background: var(--bucket-soft, var(--surface-2)); color: var(--bucket-color, var(--text));
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; width: fit-content;
  }
  .progress { position: relative; height: 7px; border-radius: 999px; background: var(--bucket-soft, var(--surface-2)); overflow: visible; margin-top: 2px; }
  .progress-fill { position: absolute; inset: 0; width: 0%; background: var(--bucket-color, var(--accent)); border-radius: 999px; transition: width .4s ease; }
  .progress-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.55; left: 0%; }
  .bucket-caption { font-size: 0.68rem; color: var(--text-muted); }

  .info-dot {
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2);
    font-size: 0.62rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-style: italic; font-family: Georgia, serif; padding: 0; vertical-align: middle;
  }
  .bucket-section { margin-bottom: 14px; }
  .bucket-section:last-child { margin-bottom: 0; }
  .bucket-section-title {
    font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .comp-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .income-chart-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .income-chart-nav .icon-btn { width: 30px; height: 30px; }
  .income-chart-nav-label { font-size: 0.82rem; font-weight: 600; }
  .mo-wrap { display: flex; margin-top: 10px; }
  .mo-axis { width: 34px; flex-shrink: 0; position: relative; height: 150px; }
  .mo-tick-num { position: absolute; right: 10px; transform: translateY(-50%); font-size: 0.52rem; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mo-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: 0.25; }
  .mo-tick-mark { position: absolute; left: 0; width: 8px; height: 1px; background: var(--border); opacity: 0.25; }
  .mo-bars-outer { flex: 1; min-width: 0; }
  .mo-bars { display: flex; align-items: flex-end; height: 150px; gap: 2px; border-bottom: 1px solid var(--border); position: relative; }
  .mo-col { flex: 1; position: relative; height: 100%; display: flex; align-items: flex-end; min-width: 0; cursor: default; }
  .mo-bar { width: 100%; max-width: 12px; margin: 0 auto; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 0; transition: opacity 0.15s ease; }
  .mo-col.has-data .mo-bar { min-height: 2px; }
  .mo-col.has-data:hover .mo-bar { opacity: 0.8; }
  .mo-axis-labels { display: flex; gap: 2px; margin-top: 4px; }
  .mo-axis-label { flex: 1; text-align: center; font-size: 0.5rem; color: var(--text-muted); min-width: 0; }
  .income-chart-tooltip { position: absolute; pointer-events: none; left: 0; top: 0; width: max-content; max-width: min(220px, calc(100vw - 32px)); background: #12181B; color: #fff; font-size: 0.68rem; line-height: 1.55; padding: 8px 10px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); z-index: 30; opacity: 0; transform: translate(-50%, calc(-100% - 8px)); transition: opacity 0.1s ease; }
  .income-chart-tooltip.show { opacity: 1; }
  .income-chart-tooltip .tt-title { font-weight: 700; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .income-chart-tooltip .tt-row { display: flex; align-items: center; gap: 6px; }
  .income-chart-tooltip .tt-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .income-chart-tooltip .tt-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .income-chart-tooltip .tt-amt { margin-left: 14px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .income-chart-tooltip .tt-total { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.22); font-weight: 700; display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .comp-title .sub { font-family: var(--font-body); font-weight: 400; font-size: 0.7rem; color: var(--text-muted); }

  .ie-chart { margin-top: 10px; }
  .ie-legend { display: flex; justify-content: center; gap: 18px; margin-bottom: 10px; }
  .ie-legend-item { display: flex; flex-direction: row; align-items: center; gap: 5px; font-size: 0.68rem; color: var(--text-muted); }
  .ie-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .ie-wrap { display: flex; }
  .ie-axis { width: 34px; flex-shrink: 0; position: relative; height: 220px; }
  .ie-tick-num { position: absolute; right: 10px; transform: translateY(-50%); font-size: 0.52rem; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ie-spine { position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: 0.25; }
  .ie-tick-mark { position: absolute; left: 0; width: 11px; height: 1px; background: var(--border); opacity: 0.25; }
  .ie-plot-outer { flex: 1; min-width: 0; position: relative; }
  .ie-plot { position: relative; height: 220px; display: flex; flex-direction: column; }
  .ie-half { flex: 1; position: relative; }
  .ie-bar { position: absolute; width: var(--ie-bar-w, 11px); min-height: 0; cursor: default; }
  .ie-half-upper .ie-bar { bottom: 0; }
  .ie-half-lower .ie-bar { top: 0; }
  .ie-bar-exp { background: var(--clay); border-radius: 0 0 3px 3px; }
  .ie-bar-inc { background: var(--accent); border-radius: 3px 3px 0 0; }
  .ie-bar-net { background: var(--gold); }
  .ie-bar-net.ie-up { border-radius: 3px 3px 0 0; }
  .ie-bar-net.ie-down { border-radius: 0 0 3px 3px; }
  .ie-gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); opacity: 0.25; }
  .ie-zeroline { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--border); opacity: 0.25; }
  .ie-pct { position: absolute; transform: translateX(-50%); font-size: 0.56rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) { .ie-pct { font-size: 0.44rem; } }
  .ie-pct-top { top: 0; color: var(--accent); }
  .ie-pct-bottom { bottom: 0; color: var(--clay); }
  .ie-month-labels { position: relative; height: 16px; margin-top: 6px; }
  .ie-month-label { position: absolute; transform: translateX(-50%); font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
  .comp-bar { display: flex; gap: 2px; height: 22px; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .comp-seg { min-width: 3px; }
  .comp-legend { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .comp-legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
  .comp-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .comp-legend-label { flex: 1; color: var(--text); }
  .comp-legend-val { color: var(--text-muted); font-size: 0.74rem; }

  .split-row { margin-bottom: 8px; }
  .split-remaining { font-size: 0.78rem; font-weight: 600; margin: 4px 0 13px; }
  .split-remaining.ok { color: var(--accent); }
  .split-remaining.bad { color: var(--danger); }
  .ledger-floor-note {
    font-size: 0.72rem; color: var(--danger); font-weight: 600; line-height: 1.35; margin-top: 6px;
  }
  .bucket-activity {
    font-size: 0.66rem; color: var(--text-muted); line-height: 1.35; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: break-word; word-break: break-word;
  }

  .acct-status {
    display: inline-block; font-size: 0.64rem; font-weight: 600; padding: 2px 7px;
    border-radius: 999px; background: var(--clay-soft); color: var(--clay);
    margin-left: 6px; white-space: nowrap; vertical-align: middle;
  }

  /* ---------- ledger ---------- */
  .ledger-filter-bar { margin-bottom: 12px; }
  .ledger-filters-details { margin-top: 8px; }
  .ledger-filters-details summary { cursor: pointer; font-size: 0.83rem; font-weight: 600; color: var(--text-muted); padding: 4px 0; list-style: none; display: flex; align-items: center; gap: 6px; }
  .ledger-filters-details summary::-webkit-details-marker { display: none; }
  .ledger-filters-details summary::before { content: "▸"; font-size: 0.7rem; }
  .ledger-filters-details[open] summary::before { content: "▾"; }
  .ledger-filters-details > .field, .ledger-filters-details > .row2 { margin-top: 10px; }
  .filter-badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 999px; }
  .ledger-list { display: flex; flex-direction: column; gap: 8px; }
  .ledger-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px 13px; }
  /* Legs of one split transaction (same splitGroupId): one is "focused"
     (a full, normal .ledger-item - own Edit/Delete) with an "i/N" corner
     badge. Order is fixed at creation order and never reshuffles - only
     which leg is focused changes. EVERY other leg gets its own plain
     stacked edge (no amount preview, just the visual cue a card is there)
     cascading outward on whichever side it actually sits relative to
     focus, each one tucked partly under the one closer to focus (z-index
     lower going outward), all at the SAME height as the focused card.
     Clicking an edge jumps focus directly to that leg. Sizes/positions
     are set in JS (sizeSplitStacks) against the stack's real measured
     width - see there for the cascade math. */
  /* isolation:isolate gives this its own stacking context, so the
     z-indexes inside (however large) only ever compete with each other -
     never with the sticky header, a modal overlay, or anything else on
     the page (which is exactly what broke: .split-stack-focus at
     z-index:100 was floating above the header and even above open
     modals, since without isolation it was competing globally). */
  .split-card-stack { position: relative; isolation: isolate; }
  .split-stack-focus { position: absolute; top: 0; z-index: 10; }
  .split-stack-rest {
    position: absolute; top: 0; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    box-sizing: border-box;
  }
  .split-corner-badge {
    font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
    color: var(--text-muted); background: var(--surface-2);
    padding: 2px 7px; border-radius: 999px;
  }
  .ledger-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .ledger-top > div:first-child { min-width: 0; }
  .ledger-desc { font-size: 0.88rem; font-weight: 600; overflow-wrap: break-word; word-break: break-word; }
  .ledger-date { font-size: 0.7rem; color: var(--text-muted); margin-top: 1px; }
  .ledger-amt { font-size: 0.95rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .ledger-amt.pos { color: var(--accent); }
  .ledger-amt.neg { color: var(--clay); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip {
    font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; font-family: var(--font-mono);
    background: var(--chip-soft, var(--surface-2)); color: var(--chip-color, var(--text-muted));
  }
  .ledger-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }
  .recurring-badge { background: var(--gold-soft); color: var(--gold); font-family: var(--font-body); font-weight: 600; }
  .ledger-user-note { font-style: italic; color: var(--text); white-space: pre-wrap; }
  .ledger-actions { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .ledger-actions .split-corner-badge { margin-left: auto; }
  .link-btn { font-size: 0.75rem; color: var(--accent); background: none; border: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .link-btn.danger { color: var(--danger); }

  .empty-state { text-align: center; padding: 26px 14px; color: var(--text-muted); font-size: 0.85rem; border: 1px dashed var(--border); border-radius: 14px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 20px; bottom: 24px; z-index: 30;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: var(--paper); border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .fab:hover { filter: brightness(1.06); }

  /* ---------- sheet / modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.42);
    display: flex; align-items: center; justify-content: center;

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "profit-first-tracker.v1";

    secondary: "Secondary — harder-to-touch accounts, often at a separate bank, meant to resist casual spending."
  };

  var REVENUE_TIERS = [
    { label: "0 – 250K", profit: 5, ownerspay: 50, tax: 15, opex: 30 },
    { label: "250K – 500K", profit: 10, ownerspay: 35, tax: 15, opex: 40 },
    { label: "500K – 1M", profit: 15, ownerspay: 20, tax: 15, opex: 50 },
    { label: "1M – 5M", profit: 10, ownerspay: 10, tax: 15, opex: 65 },
    { label: "5M – 10M", profit: 15, ownerspay: 5, tax: 15, opex: 65 },
    { label: "10M+", profit: 20, ownerspay: 0, tax: 15, opex: 65 }
  ];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  function fmt(n) {
    var v = round2(n || 0);
    var sign = v < 0 ? "-" : "";
    return sign + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Wraps the currency label in a bigger inline span - the new Saudi Riyal
  // symbol renders noticeably smaller than surrounding digits at 1em. Only
  // safe to use where the result lands in innerHTML (never in a plain-text
  // tooltip string, a native title="" attribute, or an input's value="").
  function curr() { return '<span class="curr">' + esc(state.currency) + '</span>'; }

  function accountTypeLabel(key) {
    var found = ACCOUNT_TYPES.filter(function (t) { return t.key === key; })[0];
    return found ? found.label : "Company";
  }

  function defaultState() {
    return {
      version: 2,
      business: "My Business",
      currency: "⃁",
      trackMaterials: false,
      companyDebt: 0,
      owners: [],
      reinvestPct: 50,
      distributionCadence: "quarterly",
      fiscalYearStart: "01-01",
      distributionAnchorOverride: null,
      milestoneMode: "amount",
      milestoneAmount: 100000,
      milestonePercent: 5,
      milestoneWindowStart: null,
      milestoneAccumulated: 0,
      milestoneStepsApplied: 0,
      milestoneStepsLog: [],
      defaultAccountId: null,
      buckets: [
        { id: "profit", name: "Profit", cap: 5, tap: 5, tier: "primary", linkedAccountId: null },
        { id: "ownerspay", name: "Owner's Pay", cap: 50, tap: 50, tier: "primary", linkedAccountId: null },
        { id: "tax", name: "Tax", cap: 15, tap: 15, tier: "primary", linkedAccountId: null },
        { id: "opex", name: "Opex", cap: 30, tap: 30, tier: "primary", linkedAccountId: null },
        { id: "vault", name: "Vault", cap: 0, tap: 0, tier: "secondary", linkedAccountId: null },
        { id: "taxhold", name: "Tax Hold", cap: 0, tap: 0, tier: "secondary", linkedAccountId: null }
      ],
      accounts: [
        { id: uid(), name: "Main Account", status: "", type: "company" },
        { id: CASH_ACCOUNT_ID, name: "Cash on hand", status: "", type: "company" }
      ],
      transactions: [],
      deletedTransactionIds: [],
      stateUpdatedAt: 0
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.buckets) || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.transactions)) return defaultState();
      if (!parsed.accounts.some(function (a) { return a.id === CASH_ACCOUNT_ID; })) {
        parsed.accounts.push({ id: CASH_ACCOUNT_ID, name: "Cash on hand", status: "", type: "company" });
      }
      return parsed;
    } catch (e) { return defaultState(); }
  }

  var state = loadState();

  var DIRTY_KEY = STORAGE_KEY + ".dirty";
  function markDirty() { try { localStorage.setItem(DIRTY_KEY, "1"); } catch (e) {} }
  function markClean() { try { localStorage.removeItem(DIRTY_KEY); } catch (e) {} updateUnsavedBanner(); }
  function hasUnexportedChanges() { try { return localStorage.getItem(DIRTY_KEY) === "1"; } catch (e) { return false; } }

  function persist() {
    // Backfill updatedAt for any transaction a code path pushed directly
    // (wire fees, split rows, distributions) instead of going through
    // saveTx() - every transaction needs one before it can be synced, or
    // it can't take part in the merge in reconcileState().
    state.transactions.forEach(function (t) { if (!t.updatedAt) t.updatedAt = t.createdAt || Date.now(); });
    // A coarse "this device touched its state at this instant" stamp -
    // reconcileState() uses it to decide which side's whole settings bundle
    // (business/accounts/buckets/etc.) wins when they differ, since there's
    // no clean per-field merge for something like "the current bucket list".
    state.stateUpdatedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    markDirty();
    pushStateToServer();
  }

  function syncEnabled() { return !!(SYNC_URL && SYNC_TOKEN); }

  var SETTINGS_FIELDS = [
    "business", "accounts", "buckets", "currency", "trackMaterials", "companyDebt", "owners",
    "reinvestPct", "distributionCadence", "fiscalYearStart", "distributionAnchorOverride",
    "milestoneMode", "milestoneAmount", "milestonePercent", "milestoneWindowStart",
    "milestoneAccumulated", "milestoneStepsApplied", "milestoneStepsLog", "defaultAccountId",
    "version"
  ];

  // Merges two full state snapshots into one, symmetrically - either side
  // can be passed as base or incoming and the result is the same. This is
  // what makes syncing safe regardless of which device pulls, pushes, or
  // deletes first:
  //  - deletedTransactionIds: union of both sides.
  //  - transactions: per-id union; present on only one side, kept; present
  //    on both, whichever has the later updatedAt (falling back to
  //    createdAt for old records) wins; a tombstoned id is dropped
  //    regardless of which side has it.
  //  - the settings bundle (business/accounts/buckets/etc.): taken wholesale
  //    from whichever side has the newer stateUpdatedAt, since there's no
  //    clean per-field merge for something like "the current bucket list".
  // Mirrors server.py's reconcile_state() - keep both in sync.
  function reconcileState(base, incoming) {
    var result = {};
    Object.keys(base).forEach(function (k) { result[k] = base[k]; });

    var baseDeleted = Array.isArray(base.deletedTransactionIds) ? base.deletedTransactionIds : [];
    var incomingDeleted = Array.isArray(incoming.deletedTransactionIds) ? incoming.deletedTransactionIds : [];
    var tombstones = {};
    baseDeleted.forEach(function (id) { tombstones[id] = true; });
    incomingDeleted.forEach(function (id) { tombstones[id] = true; });
    result.deletedTransactionIds = Object.keys(tombstones);

    var merged = {};
    (Array.isArray(base.transactions) ? base.transactions : []).forEach(function (t) { merged[t.id] = t; });
    (Array.isArray(incoming.transactions) ? incoming.transactions : []).forEach(function (t) {
      var existing = merged[t.id];
      if (!existing) { merged[t.id] = t; return; }
      var existingTime = existing.updatedAt || existing.createdAt || 0;
      var incomingTime = t.updatedAt || t.createdAt || 0;
      if (incomingTime > existingTime) merged[t.id] = t;
    });
    result.transactions = Object.keys(merged)
      .filter(function (id) { return !tombstones[id]; })
      .map(function (id) { return merged[id]; });

    var baseStamp = base.stateUpdatedAt || 0;
    var incomingStamp = incoming.stateUpdatedAt || 0;
    var settingsSource = incomingStamp > baseStamp ? incoming : base;
    SETTINGS_FIELDS.forEach(function (key) {
      if (settingsSource[key] !== undefined) result[key] = settingsSource[key];
    });
    result.stateUpdatedAt = Math.max(baseStamp, incomingStamp);

    return result;
  }

  // Pulls the server's copy, reconciles it against this device's local
  // state (see reconcileState()), then always pushes the result back. That
  // push is what makes this self-healing: if the server's copy was ever
  // wiped (e.g. a host redeploy with no persistent disk), this device's
  // localStorage is the real source of truth and re-populates it
  // automatically on the next sync.
  function syncFromServer(silent) {
    if (!syncEnabled()) return Promise.resolve(0);
    return fetch(SYNC_URL + "/api/state", { headers: { "Authorization": "Bearer " + SYNC_TOKEN } })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (remoteState) {
        var changed = false;
        if (remoteState && Array.isArray(remoteState.transactions)) {
          var before = JSON.stringify(state);
          state = reconcileState(state, remoteState);
          changed = before !== JSON.stringify(state);
        }
        if (changed) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
        }
        pushStateToServer();
        if (changed) {
          showToast("Synced with server.");
        } else if (!silent) {
          showToast("Up to date.");
        }
        return changed ? 1 : 0;
      })
      .catch(function () { if (!silent) showToast("Sync failed — check connection."); return 0; });
  }

  function pushStateToServer() {
    if (!syncEnabled()) return;
    fetch(SYNC_URL + "/api/state", {
      method: "PUT",
      headers: { "Authorization": "Bearer " + SYNC_TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify(state)
    }).catch(function () {});
  }

  function bucketColor(index) { return HUES[index % HUES.length]; }

  function computeDerived() {
    var bucketConfirmed = {}, bucketPending = {}, accountBalances = {};
    state.buckets.forEach(function (b) { bucketConfirmed[b.id] = 0; bucketPending[b.id] = 0; });
    state.accounts.forEach(function (a) { accountBalances[a.id] = 0; });

    var sorted = state.transactions.slice().sort(function (a, b) {
      if (a.date === b.date) return (a.createdAt || 0) - (b.createdAt || 0);
      return a.date < b.date ? -1 : 1;
    });

    var floorPriority = ["opex", "profit", "tax", "ownerspay"];
    state.buckets.forEach(function (b) { if (floorPriority.indexOf(b.id) === -1 && b.tier === "secondary") floorPriority.push(b.id); });
    var txFloorNotes = {};
    // Raw cascade data per transaction that triggered a floor draw - same
    // events as txFloorNotes but as numbers instead of display text, so
    // renderComposition() can attribute "actually split" deviation to the
    // buckets involved (see below).
    var txCascade = {};

    function drawFromBucket(bucketId, amount) {
      if (!bucketConfirmed.hasOwnProperty(bucketId)) return null;
      var ownAvail = Math.max(bucketConfirmed[bucketId], 0);
      var take = Math.min(ownAvail, amount);
      bucketConfirmed[bucketId] = round2(bucketConfirmed[bucketId] - take);
      var remaining = round2(amount - take);
      if (remaining <= 0.004) return null;
      var shortfall = remaining;
      var coveredBy = [];
      var cascade = floorPriority.filter(function (id) { return id !== bucketId; });
      cascade.forEach(function (id) {
        if (remaining <= 0.004 || !bucketConfirmed.hasOwnProperty(id)) return;
        var avail = Math.max(bucketConfirmed[id], 0);
        var pull = Math.min(avail, remaining);
        if (pull > 0) {
          bucketConfirmed[id] = round2(bucketConfirmed[id] - pull);
          coveredBy.push({ id: id, amount: pull });
          remaining = round2(remaining - pull);
        }
      });
      // if remaining > 0.004 here, every bucket is already at 0 — genuinely no money left anywhere
      return { shortfall: shortfall, coveredBy: coveredBy, stillShort: remaining };
    }

    function floorNoteText(bucketId, result) {
      var b = bucketById(bucketId);
      var txt = "Exceeded " + (b ? esc(b.name) : "this bucket") + "'s balance by " + fmt(result.shortfall) + ".";
      if (result.coveredBy.length) {
        txt += " Covered by " + result.coveredBy.map(function (c) {
          var cb = bucketById(c.id);
          return (cb ? esc(cb.name) : c.id) + " " + fmt(c.amount);
        }).join(", ") + ".";
      }
      if (result.stillShort > 0.004) txt += " " + fmt(result.stillShort) + " still short — no bucket had enough left.";
      return txt;
    }

    sorted.forEach(function (tx) {
      if (tx.type === "income") {
        if (!tx.historical && accountBalances.hasOwnProperty(tx.accountId)) accountBalances[tx.accountId] += tx.amount;
        Object.keys(tx.split || {}).forEach(function (bid) {
          var amt = tx.split[bid];
          if (!bucketConfirmed.hasOwnProperty(bid)) return;
          if (tx.pending) bucketPending[bid] += amt; else bucketConfirmed[bid] += amt;
        });
      } else if (tx.type === "expense") {
        if (tx.affectsAccount && !tx.historical && accountBalances.hasOwnProperty(tx.accountId)) accountBalances[tx.accountId] -= tx.amount;
        if (tx.affectsBucket && bucketConfirmed.hasOwnProperty(tx.bucketId)) {
          var r1 = drawFromBucket(tx.bucketId, tx.amount);
          if (r1) {
            txFloorNotes[tx.id] = floorNoteText(tx.bucketId, r1);
            txCascade[tx.id] = { bucketId: tx.bucketId, shortfall: r1.shortfall, coveredBy: r1.coveredBy };
          }
        }
      } else if (tx.type === "transfer") {
        if (!tx.historical && accountBalances.hasOwnProperty(tx.accountId)) accountBalances[tx.accountId] -= tx.amount;
        if (!tx.historical && accountBalances.hasOwnProperty(tx.toAccountId)) accountBalances[tx.toAccountId] += tx.amount;
      } else if (tx.type === "payout") {
        if (bucketConfirmed.hasOwnProperty(tx.bucketId)) {
          var r2 = drawFromBucket(tx.bucketId, tx.amount);
          if (r2) {
            txFloorNotes[tx.id] = floorNoteText(tx.bucketId, r2);
            txCascade[tx.id] = { bucketId: tx.bucketId, shortfall: r2.shortfall, coveredBy: r2.coveredBy };
          }
        }
        if (tx.toBucketId && bucketConfirmed.hasOwnProperty(tx.toBucketId)) bucketConfirmed[tx.toBucketId] += tx.amount;
        if (!tx.historical && tx.toAccountId && accountBalances.hasOwnProperty(tx.toAccountId)) accountBalances[tx.toAccountId] += tx.amount;
        if (!tx.historical && tx.fromAccountId && accountBalances.hasOwnProperty(tx.fromAccountId)) accountBalances[tx.fromAccountId] -= tx.amount;
      } else if (tx.type === "opening_balance") {
        // Pre-existing cash a bank account already had before this tracker
        // started - establishes the account's real starting balance and
        // lands directly in whichever bucket(s) it's assigned to, but it is
        // NOT income: monthlyRealRevenue() only sums type "income", so this
        // never counts toward Real Revenue or CAP milestone stepping, and
        // renderComposition()'s "Originally split" bar only sums type
        // "income" too, so it's excluded there as well - on purpose, since
        // it isn't revenue that was split, it's cash that already existed.
        if (accountBalances.hasOwnProperty(tx.accountId)) accountBalances[tx.accountId] += tx.amount;
        Object.keys(tx.allocation || {}).forEach(function (bid) {
          if (bucketConfirmed.hasOwnProperty(bid)) bucketConfirmed[bid] += tx.allocation[bid];
        });
      }
    });

    return { bucketConfirmed: bucketConfirmed, bucketPending: bucketPending, accountBalances: accountBalances, txFloorNotes: txFloorNotes, txCascade: txCascade };
  }

  function capSum() { return round2(state.buckets.filter(function (b) { return b.tier !== "secondary"; }).reduce(function (s, b) { return s + (Number(b.cap) || 0); }, 0)); }
  function tapSum() { return round2(state.buckets.filter(function (b) { return b.tier !== "secondary"; }).reduce(function (s, b) { return s + (Number(b.tap) || 0); }, 0)); }

  function bucketUsedInTx(id) {
    return state.transactions.some(function (t) { return t.bucketId === id || t.toBucketId === id || (t.split && t.split.hasOwnProperty(id)) || (t.allocation && t.allocation.hasOwnProperty(id)); });
  }
  function accountUsedInTx(id) {
    return state.transactions.some(function (t) { return t.accountId === id || t.toAccountId === id || t.fromAccountId === id; });
  }
  function accountLinkedToBucket(id) {
    return state.buckets.some(function (b) { return b.linkedAccountId === id; });
  }

  /* ---------------- render ---------------- */

  var lastDerived = null;

  function render() {
    document.getElementById("brandName").textContent = state.business || "Company Tracker";
    var derived = computeDerived();
    lastDerived = derived;

    renderAccountCards(derived);
    renderBuckets(derived);
    renderMilestonePanel();
    renderIncomeChart();
    renderComposition();
    renderLedger(derived);
  }

  function renderAccountCards(derived) {
    var el = document.getElementById("statsRow");
    var companyAccounts = state.accounts.filter(function (a) { return (a.type || "company") === "company"; });
    if (!companyAccounts.length) {
      el.innerHTML = '<div class="empty-state" style="flex:1 1 100%">No company accounts yet. Add one in Settings.</div>';
      return;
    }
    var total = companyAccounts.reduce(function (s, a) { return s + derived.accountBalances[a.id]; }, 0);
    var cardsHtml = companyAccounts.map(function (a) {
      var statusHtml = a.status ? '<span class="acct-status">' + esc(a.status) + '</span>' : "";
      return '<div class="stat"><div class="label">' + esc(a.name) + statusHtml + '</div>' +
        '<div class="value num">' + curr() + ' ' + fmt(derived.accountBalances[a.id]) + '</div></div>';
    }).join("");
    el.innerHTML = '<div class="stats-row-accounts">' + cardsHtml + '</div>' +
      '<div class="stat total"><div class="label">' +
        '<span class="total-label-full">Total across company accounts</span>' +
        '<span class="total-label-short">TOTAL <span class="total-note">— across company accounts</span></span>' +
      '</div><div class="value num">' + curr() + ' ' + fmt(total) + '</div></div>';
  }

  function monthLabel(monthStr) {
    var parts = monthStr.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
    return d.toLocaleDateString(undefined, { month: "short" });
  }
  function monthYearLabel(monthStr) {
    var parts = monthStr.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
    return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  }
  function addMonths(monthStr, delta) {
    var parts = monthStr.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function mostRecentIncomeMonth() {
    var months = state.transactions.filter(function (t) { return t.type === "income" && t.date; }).map(function (t) { return t.date.slice(0, 7); });
    if (!months.length) return todayStr().slice(0, 7);
    return months.sort()[months.length - 1];
  }

  var incomeChartView = "monthly";
  var incomeChartMonthOffset = 0;

  function renderIncomeChart() {
    var el = document.getElementById("incomeChartSection");
    if (!el) return;
    var toggleHtml =
      '<div class="segmented" style="max-width:180px">' +
        '<button data-income-view="monthly" class="' + (incomeChartView === "monthly" ? "active" : "") + '">Monthly</button>' +
        '<button data-income-view="yearly" class="' + (incomeChartView === "yearly" ? "active" : "") + '">Yearly</button>' +
      '</div>';
    if (incomeChartView === "yearly") renderIncomeChartYearly(el, toggleHtml);
    else renderIncomeChartMonthly(el, toggleHtml);
  }

  function mostRecentIncomeYear() {
    var years = state.transactions.filter(function (t) { return t.type === "income" && t.date; }).map(function (t) { return t.date.slice(0, 4); });
    if (!years.length) return todayStr().slice(0, 4);
    return years.sort()[years.length - 1];
  }

  var incomeChartYearOffset = 0;
  var incomeYearlySubView = "composition";


  function renderIncomeChartYearly(el, toggleHtml) {
    var targetYear = String(Number(todayStr().slice(0, 4)) + incomeChartYearOffset);
    var byMonth = {};
    state.transactions.forEach(function (t) {
      if (t.type !== "income" || (t.date || "").slice(0, 4) !== targetYear) return;
      var m = t.date.slice(0, 7);
      var real = round2((t.amount || 0) - (t.materialsCost || 0));
      byMonth[m] = round2((byMonth[m] || 0) + real);
    });
    var months = [];
    for (var i = 0; i < 12; i++) {
      var m = targetYear + "-" + String(i + 1).padStart(2, "0");
      months.push({ period: m, total: byMonth[m] || 0 });
    }
    var yearTotal = round2(months.reduce(function (s, d) { return s + d.total; }, 0));

    var navHtml =
      '<div class="income-chart-nav">' +
        '<button type="button" class="icon-btn" id="incomeYearPrev" aria-label="Previous year">' + backIcon() + '</button>' +
        '<div class="income-chart-nav-label">' + esc(targetYear) + '</div>' +
        '<button type="button" class="icon-btn" id="incomeYearNext" aria-label="Next year" style="transform:rotate(180deg)">' + backIcon() + '</button>' +
      '</div>';

    var subToggleHtml =
      '<div class="segmented segmented-compact" style="display:inline-flex;margin-top:8px">' +
        '<button data-income-yearly-sub="composition" class="' + (incomeYearlySubView === "composition" ? "active" : "") + '">Income</button>' +
        '<button data-income-yearly-sub="incomeExpense" class="' + (incomeYearlySubView === "incomeExpense" ? "active" : "") + '">vs Expense</button>' +
      '</div>';

    if (incomeYearlySubView === "incomeExpense") {
      renderIncomeExpenseYearly(el, toggleHtml, subToggleHtml, navHtml, targetYear);
      return;
    }

    if (yearTotal <= 0) {
      el.innerHTML = '<div class="panel">' + '<div class="comp-title">Income</div>' + toggleHtml + navHtml + subToggleHtml + '<div class="empty-state" style="margin-top:12px">No income logged in ' + esc(targetYear) + '.</div></div>';
      wireIncomeChartToggle(el);
      wireIncomeYearNav(el);
      wireIncomeYearlySubToggle(el);
      return;
    }

    var maxVal = months.reduce(function (m, d) { return Math.max(m, d.total); }, 0);

    var tickStep = niceAxisStep(Math.max(maxVal, 1) * 1.15, 4);
    var scaleMax = Math.ceil((Math.max(maxVal, 1) * 1.15) / tickStep) * tickStep || tickStep;

    var axisNumbersHtml = [];
    var tickMarksHtml = ['<div class="mo-spine"></div>'];
    for (var v = 0; v <= scaleMax; v += tickStep) {
      var topPct = round2(100 - (v / scaleMax) * 100);
      axisNumbersHtml.push('<div class="mo-tick-num" style="top:' + topPct + '%">' + Math.round(v / 1000) + '</div>');
      if (v > 0) tickMarksHtml.push('<div class="mo-tick-mark" style="top:' + topPct + '%"></div>');
    }

    var barsHtml = months.map(function (d) {
      var pct = scaleMax > 0 ? round2((d.total / scaleMax) * 100) : 0;
      var hasData = d.total > 0;
      var tipAttr = "";
      if (hasData) {
        var tip = { label: monthLabel(d.period) + " " + targetYear, rows: [], total: state.currency + " " + fmt(d.total) };
        tipAttr = " data-tip='" + esc(JSON.stringify(tip)) + "'";
      }
      return (
        '<div class="mo-col' + (hasData ? " has-data" : "") + '"' + tipAttr + '>' +
          '<div class="mo-bar" style="height:' + pct + '%"></div>' +
        '</div>'
      );
    }).join("");

    var axisLabelsHtml = months.map(function (d) { return '<div class="mo-axis-label">' + esc(monthLabel(d.period)) + '</div>'; }).join("");

    el.innerHTML =
      '<div class="panel">' +
        '<div class="comp-title">Income <span class="sub">' + curr() + ' ' + fmt(yearTotal) + ' total</span></div>' +
        toggleHtml +
        navHtml +
        subToggleHtml +
        '<div class="mo-wrap">' +
          '<div class="mo-axis">' + axisNumbersHtml.join("") + '</div>' +
          '<div class="mo-bars-outer">' +
            '<div class="mo-bars">' + barsHtml + tickMarksHtml.join("") + '<div class="income-chart-tooltip" id="moTooltip"></div></div>' +
            '<div class="mo-axis-labels">' + axisLabelsHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    wireIncomeChartToggle(el);
    wireIncomeYearNav(el);
    wireMoChartHover(el);
    wireIncomeYearlySubToggle(el);
  }

  function wireIncomeYearlySubToggle(el) {
    el.querySelectorAll("[data-income-yearly-sub]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        incomeYearlySubView = btn.getAttribute("data-income-yearly-sub");
        renderIncomeChart();
      });
    });
  }

  function niceAxisStep(maxVal, targetTicks) {
    var raw = maxVal / Math.max(1, targetTicks);
    if (raw <= 0) return 1;
    // Snap to the nearest step in the standard 1/2/5x10^n "nice number"
    // sequence, not just the power of 10 below raw - that alone regularly
    // undershoots badly (e.g. raw=862 rounds down to 100, an 8.6x smaller
    // step than intended), producing 30+ cramped, overlapping axis ticks
    // instead of the targeted ~4.
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return niceNorm * mag;
  }

  function renderIncomeExpenseYearly(el, toggleHtml, subToggleHtml, navHtml, targetYear) {
    var byMonth = {};
    for (var mi = 0; mi < 12; mi++) {
      var key = targetYear + "-" + String(mi + 1).padStart(2, "0");
      byMonth[key] = { income: 0, expense: 0 };
    }
    state.transactions.forEach(function (t) {
      if ((t.date || "").slice(0, 4) !== targetYear) return;
      var m = t.date.slice(0, 7);
      if (!byMonth.hasOwnProperty(m)) return;
      if (t.type === "income") byMonth[m].income = round2(byMonth[m].income + (t.amount || 0) - (t.materialsCost || 0));
      else if (t.type === "expense") byMonth[m].expense = round2(byMonth[m].expense + (t.amount || 0));
      else if (t.type === "payout" && !(t.toBucketId && !t.toAccountId)) byMonth[m].expense = round2(byMonth[m].expense + (t.amount || 0));
    });
    var months = [];
    for (var i = 0; i < 12; i++) {
      var key2 = targetYear + "-" + String(i + 1).padStart(2, "0");
      var inc = byMonth[key2].income, exp = byMonth[key2].expense;
      months.push({ period: key2, income: inc, expense: exp, net: round2(inc - exp) });
    }
    var totalIncome = round2(months.reduce(function (s, d) { return s + d.income; }, 0));
    var totalExpense = round2(months.reduce(function (s, d) { return s + d.expense; }, 0));

    if (totalIncome <= 0 && totalExpense <= 0) {
      el.innerHTML = '<div class="panel">' + toggleHtml + navHtml + subToggleHtml + '<div class="empty-state" style="margin-top:12px">No income or expense logged in ' + esc(targetYear) + '.</div></div>';
      wireIncomeChartToggle(el);
      wireIncomeYearNav(el);
      wireIncomeYearlySubToggle(el);
      return;
    }

    var maxRaw = months.reduce(function (m, d) { return Math.max(m, d.income, d.expense); }, 0);
    var tickStep = niceAxisStep(maxRaw * 1.15, 4);
    var scaleMax = Math.ceil((maxRaw * 1.15) / tickStep) * tickStep || tickStep;

    var N = 14;
    var slotPct = 100 / N;
    function boundaryPct(slotIdx) { return slotIdx * slotPct + slotPct / 3; }
    var barW = window.innerWidth < 480 ? 6 : 11;

    var slotsHtmlUpper = [];
    var slotsHtmlLower = [];
    var pctLabelsHtml = [];
    var monthLabelsHtml = [];
    var gridlinesHtml = [];

    months.forEach(function (d, idx) {
      var slotIdx = idx + 1;
      var incPct = scaleMax > 0 ? round2((Math.max(d.income, 0) / scaleMax) * 100) : 0;
      var expPct = scaleMax > 0 ? round2((Math.max(d.expense, 0) / scaleMax) * 100) : 0;
      var netPct = scaleMax > 0 ? round2((Math.min(Math.abs(d.net), scaleMax) / scaleMax) * 100) : 0;
      var netUp = d.net >= 0;
      var tip = {
        label: monthLabel(d.period) + " " + targetYear,
        rows: [
          { name: "Income", hue: "accent", amount: state.currency + " " + fmt(d.income) },
          { name: "Expense", hue: "clay", amount: state.currency + " " + fmt(d.expense) },
          { name: "Net", hue: "gold", amount: state.currency + " " + (d.net >= 0 ? "+" : "") + fmt(d.net) }
        ]
      };
      var tipAttr = " data-tip='" + esc(JSON.stringify(tip)) + "'";
      var bx = round2(boundaryPct(slotIdx));

      if (d.income > 0) {
        slotsHtmlUpper.push('<div class="ie-bar ie-bar-inc" style="left:calc(' + bx + '% - 0px);height:' + incPct + '%"' + tipAttr + '></div>');
      }
      if (netUp && d.net !== 0) {
        slotsHtmlUpper.push('<div class="ie-bar ie-bar-net ie-up" style="left:calc(' + bx + '% + ' + barW + 'px);height:' + netPct + '%"' + tipAttr + '></div>');
      }
      if (d.expense > 0) {
        slotsHtmlLower.push('<div class="ie-bar ie-bar-exp" style="left:calc(' + bx + '% - ' + barW + 'px);height:' + expPct + '%"' + tipAttr + '></div>');
      }
      if (!netUp && d.net !== 0) {
        slotsHtmlLower.push('<div class="ie-bar ie-bar-net ie-down" style="left:calc(' + bx + '% + ' + barW + 'px);height:' + netPct + '%"' + tipAttr + '></div>');
      }

      if (d.income > 0 || d.expense > 0) {
        var midX = round2((boundaryPct(slotIdx) + boundaryPct(slotIdx + 1)) / 2);
        var incSharePct = totalIncome > 0 ? Math.round((d.income / totalIncome) * 100) : 0;
        var expSharePct = totalExpense > 0 ? Math.round((d.expense / totalExpense) * 100) : 0;
        pctLabelsHtml.push('<div class="ie-pct ie-pct-top" style="left:' + midX + '%">+' + incSharePct + '%</div>');
        pctLabelsHtml.push('<div class="ie-pct ie-pct-bottom" style="left:' + midX + '%">-' + expSharePct + '%</div>');
      }
      monthLabelsHtml.push('<div class="ie-month-label" style="left:' + round2(boundaryPct(slotIdx)) + '%">' + esc(monthLabel(d.period)) + '</div>');
      gridlinesHtml.push('<div class="ie-gridline" style="left:' + round2(boundaryPct(slotIdx)) + '%"></div>');
    });

    var axisNumbersHtml = [];
    var tickMarksHtml = ['<div class="ie-spine"></div>'];
    for (var v = 0; v <= scaleMax; v += tickStep) {
      var pctFromMid = (v / scaleMax) * 50;
      var topUp = round2(50 - pctFromMid), topDown = round2(50 + pctFromMid);
      axisNumbersHtml.push('<div class="ie-tick-num" style="top:' + topUp + '%">' + Math.round(v / 1000) + '</div>');
      if (v > 0) {
        axisNumbersHtml.push('<div class="ie-tick-num" style="top:' + topDown + '%">-' + Math.round(v / 1000) + '</div>');
        tickMarksHtml.push('<div class="ie-tick-mark" style="top:' + topUp + '%"></div>');
        tickMarksHtml.push('<div class="ie-tick-mark" style="top:' + topDown + '%"></div>');
      }
    }

    el.innerHTML =
      '<div class="panel">' +
        '<div class="comp-title">Yearly income vs expense <span class="sub">' + fmt(totalIncome) + ' in · ' + fmt(totalExpense) + ' out (' + curr() + ')</span></div>' +
        toggleHtml +
        navHtml +
        subToggleHtml +
        '<div class="ie-chart" style="--ie-bar-w:' + barW + 'px">' +
          '<div class="ie-legend">' +
            '<div class="ie-legend-item"><span class="ie-legend-dot" style="background:var(--clay)"></span>EXP</div>' +
            '<div class="ie-legend-item"><span class="ie-legend-dot" style="background:var(--accent)"></span>INC</div>' +

  function renderIncomeChartMonthly(el, toggleHtml) {
    // Anchor on today's real month, same convention the milestone pacing
    // card uses - not the most recent month with income in it, which used
    // to leave this stuck on August into September with nothing logged yet.
    var targetMonth = addMonths(todayStr().slice(0, 7), incomeChartMonthOffset);
    var entries = state.transactions.filter(function (t) { return t.type === "income" && (t.date || "").slice(0, 7) === targetMonth; })
      .slice().sort(function (a, b) { return a.date === b.date ? (a.createdAt || 0) - (b.createdAt || 0) : (a.date < b.date ? -1 : 1); });

    var navHtml =
      '<div class="income-chart-nav">' +
        '<button type="button" class="icon-btn" id="incomeMonthPrev" aria-label="Previous month">' + backIcon() + '</button>' +
        '<div class="income-chart-nav-label">' + esc(monthYearLabel(targetMonth)) + '</div>' +
        '<button type="button" class="icon-btn" id="incomeMonthNext" aria-label="Next month" style="transform:rotate(180deg)">' + backIcon() + '</button>' +
      '</div>';

    if (!entries.length) {
      el.innerHTML = '<div class="panel">' + '<div class="comp-title">Income</div>' + toggleHtml + navHtml + '<div class="empty-state" style="margin-top:12px">No income logged in ' + esc(monthYearLabel(targetMonth)) + '.</div></div>';
      wireIncomeChartToggle(el);
      wireIncomeMonthNav(el);
      return;
    }

    var monthTotal = round2(entries.reduce(function (s, t) { return s + round2((t.amount || 0) - (t.materialsCost || 0)); }, 0));

    var byDay = {};
    entries.forEach(function (t) {
      var day = Number((t.date || "").slice(8, 10));
      if (!byDay[day]) byDay[day] = { total: 0, txns: [] };
      var real = round2((t.amount || 0) - (t.materialsCost || 0));
      byDay[day].total = round2(byDay[day].total + real);
      byDay[day].txns.push({ desc: t.description || "Income", amount: real });
    });

    var mParts = targetMonth.split("-");
    var daysInMonth = new Date(Number(mParts[0]), Number(mParts[1]), 0).getDate();
    var days = [];
    for (var d = 1; d <= daysInMonth; d++) days.push({ day: d, total: (byDay[d] || { total: 0 }).total, txns: (byDay[d] || { txns: [] }).txns });

    var maxVal = days.reduce(function (m, dd) { return Math.max(m, dd.total); }, 0);

    var tickStep = niceAxisStep(Math.max(maxVal, 1) * 1.15, 4);
    var scaleMax = Math.ceil((Math.max(maxVal, 1) * 1.15) / tickStep) * tickStep || tickStep;

    var axisNumbersHtml = [];
    var tickMarksHtml = ['<div class="mo-spine"></div>'];
    for (var v = 0; v <= scaleMax; v += tickStep) {
      var topPct = round2(100 - (v / scaleMax) * 100);
      axisNumbersHtml.push('<div class="mo-tick-num" style="top:' + topPct + '%">' + Math.round(v / 1000) + '</div>');
      if (v > 0) tickMarksHtml.push('<div class="mo-tick-mark" style="top:' + topPct + '%"></div>');
    }

    var barsHtml = days.map(function (dd) {
      var pct = scaleMax > 0 ? round2((dd.total / scaleMax) * 100) : 0;
      var hasData = dd.total > 0;
      var tipAttr = "";
      if (hasData) {
        var rows = dd.txns.map(function (tx) { return { name: tx.desc, hue: "accent", amount: state.currency + " " + fmt(tx.amount) }; });
        var tip = { label: monthLabel(targetMonth + "-01") + " " + dd.day, rows: rows, total: state.currency + " " + fmt(dd.total) };
        tipAttr = " data-tip='" + esc(JSON.stringify(tip)) + "'";
      }
      return (
        '<div class="mo-col' + (hasData ? " has-data" : "") + '"' + tipAttr + '>' +
          '<div class="mo-bar" style="height:' + pct + '%"></div>' +
        '</div>'
      );
    }).join("");

    var axisLabelsHtml = days.map(function (dd) { return '<div class="mo-axis-label">' + dd.day + '</div>'; }).join("");

    el.innerHTML =
      '<div class="panel">' +
        '<div class="comp-title">Income <span class="sub">' + curr() + ' ' + fmt(monthTotal) + ' · ' + entries.length + ' entr' + (entries.length === 1 ? "y" : "ies") + '</span></div>' +
        toggleHtml +
        navHtml +
        '<div class="mo-wrap">' +
          '<div class="mo-axis">' + axisNumbersHtml.join("") + '</div>' +
          '<div class="mo-bars-outer">' +
            '<div class="mo-bars">' + barsHtml + tickMarksHtml.join("") + '<div class="income-chart-tooltip" id="moTooltip"></div></div>' +
            '<div class="mo-axis-labels">' + axisLabelsHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    wireIncomeChartToggle(el);
    wireIncomeMonthNav(el);
    wireMoChartHover(el);

  function wireIncomeMonthNav(el) {

  }

  function wireIncomeYearNav(el) {
    var prevBtn = el.querySelector("#incomeYearPrev");
    var nextBtn = el.querySelector("#incomeYearNext");
    if (prevBtn) prevBtn.addEventListener("click", function () { incomeChartYearOffset -= 1; renderIncomeChart(); });

  function wireIncomeChartToggle(el) {
    el.querySelectorAll("[data-income-view]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        incomeChartView = btn.getAttribute("data-income-view");
        renderIncomeChart();
      });
    });
  }

  var compositionView = "monthly"; // "monthly" or "yearly" - mirrors the income chart's own toggle
  var compositionMonthOffset = 0;
  var compositionYearOffset = 0;

  // Both bars are scoped to the SAME period, so they're actually comparable:
  //  - "Originally split": each income transaction's own split amounts,
  //    for income dated within the period (excludes opening_balance - it
  //    isn't income).
  //  - "Actually split": originally split, adjusted for any floor/cascade
  //    event (see drawFromBucket()/txCascade in computeDerived()) triggered
  //    by a transaction dated within the period. If a bucket's own expense
  //    exceeds its balance, the shortfall is pulled from other buckets in
  //    floorPriority order - that bucket's "actual" goes UP by the full
  //    shortfall (it really consumed that much), and each bucket that
  //    covered part of it goes DOWN by the amount it gave up. A bucket with
  //    no cascade involvement nets to exactly its allocation - zero
  //    deviation. This is deliberately NOT a period-start/period-end
  //    confirmed-balance diff - that approach was tried and rejected
  //    because ordinary spend-down (not deviation) polluted the numbers.
  function renderComposition() {
    var el = document.getElementById("compositionSection");

    var toggleHtml =
      '<div class="segmented" style="max-width:180px">' +
        '<button data-comp-view="monthly" class="' + (compositionView === "monthly" ? "active" : "") + '">Monthly</button>' +
        '<button data-comp-view="yearly" class="' + (compositionView === "yearly" ? "active" : "") + '">Yearly</button>' +
      '</div>';

    var periodLabel, periodMatch;
    if (compositionView === "yearly") {
      var targetYear = String(Number(todayStr().slice(0, 4)) + compositionYearOffset);
      periodLabel = targetYear;
      periodMatch = function (d) { return (d || "").slice(0, 4) === targetYear; };
    } else {
      var targetMonth = addMonths(todayStr().slice(0, 7), compositionMonthOffset);
      periodLabel = monthYearLabel(targetMonth);
      periodMatch = function (d) { return (d || "").slice(0, 7) === targetMonth; };
    }

    var navHtml =
      '<div class="income-chart-nav">' +
        '<button type="button" class="icon-btn" id="compPrev" aria-label="Previous">' + backIcon() + '</button>' +
        '<div class="income-chart-nav-label">' + esc(periodLabel) + '</div>' +
        '<button type="button" class="icon-btn" id="compNext" aria-label="Next" style="transform:rotate(180deg)">' + backIcon() + '</button>' +
      '</div>';

    var originalTotals = {};
    state.buckets.forEach(function (b) { originalTotals[b.id] = 0; });
    state.transactions.forEach(function (t) {
      if (t.type === "income" && t.split && periodMatch(t.date)) {
        Object.keys(t.split).forEach(function (bid) {
          if (originalTotals.hasOwnProperty(bid)) originalTotals[bid] += t.split[bid];
        });
      }
    });
    var originalGrand = state.buckets.reduce(function (s, b) { return s + (originalTotals[b.id] || 0); }, 0);

    var txCascade = (lastDerived && lastDerived.txCascade) || {};
    var actualTotals = {};
    state.buckets.forEach(function (b) { actualTotals[b.id] = originalTotals[b.id] || 0; });
    state.transactions.forEach(function (t) {
      if (!periodMatch(t.date)) return;
      var cascade = txCascade[t.id];
      if (!cascade) return;
      if (actualTotals.hasOwnProperty(cascade.bucketId)) {
        actualTotals[cascade.bucketId] = round2(actualTotals[cascade.bucketId] + cascade.shortfall);
      }
      cascade.coveredBy.forEach(function (c) {
        if (actualTotals.hasOwnProperty(c.id)) actualTotals[c.id] = round2(actualTotals[c.id] - c.amount);
      });
    });
    var actualGrand = state.buckets.reduce(function (s, b) { return s + (actualTotals[b.id] || 0); }, 0);

    if (originalGrand <= 0 && actualGrand <= 0) {
      el.innerHTML = '<div class="panel">' + '<div class="comp-title">Allocation <span class="sub">' + esc(periodLabel) + '</span></div>' + toggleHtml + navHtml + '<div class="empty-state" style="margin-top:12px">Nothing logged in ' + esc(periodLabel) + '.</div></div>';
      wireCompositionNav(el);
      return;
    }

    function buildBar(totals, grand) {
      return state.buckets.map(function (b, i) {
        var amt = totals[b.id] || 0;
        if (amt <= 0 || grand <= 0) return "";
        var pct = (amt / grand) * 100;
        var hue = bucketColor(i);
        return '<div class="comp-seg" style="flex:' + pct + ' 0 0%; background:var(--' + hue + ')" title="' + esc(b.name) + ': ' + esc(state.currency) + ' ' + fmt(amt) + ' (' + pct.toFixed(1) + '%)"></div>';
      }).join("");
    }

    function pctOf(amt, grand) { return grand > 0 ? (amt / grand) * 100 : 0; }

    var legendHtml = state.buckets.map(function (b, i) {
      var origAmt = originalTotals[b.id] || 0;
      var actAmt = actualTotals[b.id] || 0;
      if (origAmt <= 0 && actAmt <= 0) return "";
      var hue = bucketColor(i);
      return '<div class="comp-legend-item"><span class="comp-dot" style="background:var(--' + hue + ')"></span>' +
        '<span class="comp-legend-label">' + esc(b.name) + '</span>' +
        '<span class="comp-legend-val num">CAP ' + pctOf(origAmt, originalGrand).toFixed(1) + '% · Actual ' + pctOf(actAmt, actualGrand).toFixed(1) + '%</span></div>';
    }).join("");

    el.innerHTML =
      '<div class="panel">' +
        '<div class="comp-title">Allocation <span class="sub">' + esc(periodLabel) + '</span></div>' +
        toggleHtml + navHtml +
        '<div style="font-size:0.72rem; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px">CAP (' + curr() + ' ' + fmt(originalGrand) + ')</div>' +
        '<div class="comp-bar">' + buildBar(originalTotals, originalGrand) + '</div>' +
        '<div style="font-size:0.72rem; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--text-muted); margin:12px 0 4px">Actual (' + curr() + ' ' + fmt(actualGrand) + ')</div>' +
        '<div class="comp-bar">' + buildBar(actualTotals, actualGrand) + '</div>' +
        '<div class="comp-legend" style="margin-top:12px">' + legendHtml + '</div>' +
      '</div>';
    wireCompositionNav(el);
  }

  function wireCompositionNav(el) {
    el.querySelectorAll("[data-comp-view]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        compositionView = btn.getAttribute("data-comp-view");
        renderComposition();
      });
    });
    var prevBtn = el.querySelector("#compPrev");
    var nextBtn = el.querySelector("#compNext");
    if (prevBtn) prevBtn.addEventListener("click", function () {
      if (compositionView === "yearly") compositionYearOffset -= 1; else compositionMonthOffset -= 1;
      renderComposition();
    });
    if (nextBtn) nextBtn.addEventListener("click", function () {
      if (compositionView === "yearly") compositionYearOffset += 1; else compositionMonthOffset += 1;
      renderComposition();
    });
  }

  function latestIncomeNote() {
    var pendingTx = state.transactions.filter(function (t) { return t.type === "income" && t.pending; });
    if (!pendingTx.length) return "";
    pendingTx.sort(function (a, b) {
      if (a.date === b.date) return (b.createdAt || 0) - (a.createdAt || 0);
      return a.date < b.date ? 1 : -1;
    });
    var tx = pendingTx[0];
    var acct = accountById(tx.accountId);
    var prefix = pendingTx.length > 1 ? pendingTx.length + " pending — latest: " : "Latest: ";
    return prefix + esc(tx.description || "income") + " · " + shortDate(tx.date) + " — into " + (acct ? esc(acct.name) : "?");
  }

  function renderIncomeCard(totalPending) {
    var note = latestIncomeNote();
    var btnHtml = totalPending > 0 ? '<button class="btn btn-primary" data-action="confirm-all" style="margin-top:8px; padding:8px; font-size:0.82rem;">Confirm all</button>' : "";
    return '<div class="bucket-card" style="--bucket-color:var(--gold);--bucket-soft:var(--gold-soft)">' +
      '<div class="bucket-name">Income</div>' +
      '<div class="bucket-balance num">' + fmt(totalPending) + '</div>' +
      '<div class="bucket-caption">' + (totalPending > 0 ? "Not yet allocated" : "Nothing pending") + '</div>' +
      (note ? '<div class="bucket-activity">' + note + '</div>' : "") +
      btnHtml +
    '</div>';
  }

  function bucketLinkedCaption(b) {
    var linkedAcct = b.linkedAccountId ? accountById(b.linkedAccountId) : null;
    return '<div class="bucket-caption">' + (linkedAcct ? "→ " + esc(linkedAcct.name) : "Virtual") + '</div>';
  }

  function buildBucketCardHtml(b, derived) {
    var i = bucketIndex(b.id);
    var hue = bucketColor(i);
    var confirmed = derived.bucketConfirmed[b.id] || 0;
    var pending = derived.bucketPending[b.id] || 0;
    var cap = Number(b.cap) || 0, tap = Number(b.tap) || 0;
    var showPlainPending = round2(confirmed) === 0 && pending > 0;
    var mainBalance = showPlainPending ? pending : confirmed;
    var pendingHtml = (pending > 0 && !showPlainPending)
      ? '<span class="pill" style="--bucket-color:var(--' + hue + ');--bucket-soft:var(--' + hue + '-soft)">+' + fmt(pending) + ' pending</span>'
      : '<span class="pill" style="visibility:hidden">placeholder</span>';
    var activity = bucketActivityNote(b.id);
    var distributeHtml = "";
    if (b.id === "profit") {
      distributeHtml = distributionDue()
        ? '<button class="link-btn" data-action="distribute" style="margin-top:2px; text-align:left;">Distribute →</button>'
        : '<div class="bucket-activity">Next distribution in ' + daysUntilDistribution() + ' day' + (daysUntilDistribution() === 1 ? "" : "s") + '</div>';
    }
    var isSecondary = b.tier === "secondary";
    var capHtml = isSecondary ? "" :
      '<div class="progress"><div class="progress-fill" style="width:' + Math.min(cap, 100) + '%"></div><div class="progress-marker" style="left:' + Math.min(tap, 100) + '%"></div></div>' +
      '<div class="bucket-caption">CAP ' + cap + '%  ·  TAP ' + tap + '%</div>';
    return (
      '<div class="bucket-card" style="--bucket-color:var(--' + hue + ');--bucket-soft:var(--' + hue + '-soft)">' +
        '<div class="bucket-name">' + esc(b.name) + '</div>' +
        '<div class="bucket-balance num">' + fmt(mainBalance) + '</div>' +
        pendingHtml +
        capHtml +
        bucketLinkedCaption(b) +
        (activity ? '<div class="bucket-activity">' + activity + '</div>' : "") +
        distributeHtml +
      '</div>'
    );
  }

  function renderBuckets(derived) {
    var container = document.getElementById("bucketGrid");
    var secondaryContainer = document.getElementById("secondaryBucketGrid");
    var totalPending = state.buckets.reduce(function (s, b) { return s + (derived.bucketPending[b.id] || 0); }, 0);
    var incomeCardHtml = renderIncomeCard(totalPending);

    if (!state.buckets.length) {
      container.innerHTML = '<div class="bucket-grid">' + incomeCardHtml + '</div><div class="empty-state">No buckets configured. Add some in Settings.</div>';
      secondaryContainer.innerHTML = "";
      return;
    }

    var primaryBuckets = state.buckets.filter(function (b) { return b.tier !== "secondary"; });
    var secondaryBuckets = state.buckets.filter(function (b) { return b.tier === "secondary"; });

    function section(label, tierKey, buckets, leadingCardHtml) {
      if (!buckets.length && !leadingCardHtml) return "";
      return '<div class="bucket-section">' +
        '<div class="bucket-section-title">' + label + ' <button class="info-dot" data-info-tier="' + tierKey + '" title="' + esc(TIER_INFO[tierKey]) + '" aria-label="What does ' + label + ' mean?">i</button></div>' +
        '<div class="bucket-grid">' + (leadingCardHtml || "") + buckets.map(function (b) { return buildBucketCardHtml(b, derived); }).join("") + '</div>' +
      '</div>';
    }

    // Secondary buckets render into their own container, outside #frozenTop
    // (see the HTML) - they're "harder-to-touch" accounts you check on
    // rarely, not the everyday-glance summary the freeze is meant for.
    container.innerHTML = section("Primary", "primary", primaryBuckets, incomeCardHtml);
    secondaryContainer.innerHTML = section("Secondary", "secondary", secondaryBuckets, "");
  }

  function monthStartStr(dateStr) { return dateStr.slice(0, 7) + "-01"; }

  function getMilestoneAmount() {
    if (state.milestoneMode === "percent") {
      return round2((state.milestonePercent || 0) / 100 * monthlyRealRevenue());
    }
    return state.milestoneAmount != null ? state.milestoneAmount : 100000;
  }

  function applyOneMilestoneStep() {
    if (!bucketById("opex")) return null;
    var increasePriority = ["profit", "ownerspay", "tax", "opex"];
    var decreasePriority = ["opex", "tax", "ownerspay", "profit"];
    var target = null;
    for (var i = 0; i < increasePriority.length; i++) {
      var b = bucketById(increasePriority[i]);
      if (!b) continue;
      if ((Number(b.cap) || 0) < (Number(b.tap) || 0)) { target = b; break; }
    }
    if (!target) return null;
    var source = null;
    for (var j = 0; j < decreasePriority.length; j++) {
      var b2 = bucketById(decreasePriority[j]);
      if (!b2 || b2 === target) continue;
      if ((Number(b2.cap) || 0) > (Number(b2.tap) || 0)) { source = b2; break; }
    }
    if (!source) return null;
    source.cap = round2((Number(source.cap) || 0) - 1);
    target.cap = round2((Number(target.cap) || 0) + 1);
    return { sourceId: source.id, targetId: target.id };
  }

  function ensureMilestoneWindowCurrent() {
    var todayMonthStart = monthStartStr(todayStr());
    if (state.milestoneWindowStart !== todayMonthStart) {
      state.milestoneWindowStart = todayMonthStart;
      state.milestoneStepsApplied = 0;
      state.milestoneStepsLog = [];
    }
    state.milestoneAccumulated = monthlyRealRevenue();
  }

  function checkMilestoneSteps(txRealRevenue, txId) {
    if (!txRealRevenue || txRealRevenue <= 0) return 0;
    var milestoneAmount = getMilestoneAmount();
    if (!milestoneAmount || milestoneAmount <= 0) return 0;
    if (!bucketById("opex")) return 0;
    ensureMilestoneWindowCurrent();
    var targetSteps = Math.floor(state.milestoneAccumulated / milestoneAmount);
    var already = state.milestoneStepsApplied || 0;
    var newSteps = targetSteps - already;
    var applied = 0;
    if (newSteps > 0) {
      if (!state.milestoneStepsLog) state.milestoneStepsLog = [];
      for (var i = 0; i < newSteps; i++) {
        var step = applyOneMilestoneStep();
        if (step) {
          applied++;
          state.milestoneStepsLog.push({ txId: txId, sourceId: step.sourceId, targetId: step.targetId });
        }
      }
      state.milestoneStepsApplied = already + applied;
    }

    sizeSplitStacks(wrap);
    Array.prototype.forEach.call(wrap.querySelectorAll(".split-stack-rest"), function (el) {
      el.addEventListener("click", function () {
        var groupId = el.getAttribute("data-split-group");
        splitStackFocus[groupId] = el.getAttribute("data-tx-id");
        renderLedgerList();
      });

  }

  function renderLedgerList() {
    var wrap = document.getElementById("ledgerListWrap");
    if (!wrap) return;
    var filtered = sortedFilteredLedger();
    var active = ledgerFiltersActive();
    var countEl = document.getElementById("ledgerCount");
    if (countEl) {
      countEl.textContent = active
        ? "· " + filtered.length + " of " + state.transactions.length
        : "· " + state.transactions.length;
    }
    var badgeEl = document.getElementById("ledgerFilterBadge");
    if (badgeEl) badgeEl.style.display = active ? "" : "none";
    var clearBtnEl = document.getElementById("ledgerClearFilters");
    if (clearBtnEl) clearBtnEl.style.display = active ? "" : "none";
    if (!filtered.length) {
      wrap.innerHTML = '<div class="empty-state">No transactions match your filters.</div>';
      return;
    }
    var groups = groupAdjacentLedgerSplits(filtered);
    wrap.innerHTML = '<div class="ledger-list">' + groups.map(function (g) {
      return g.kind === "split" ? renderSplitLedgerGroup(g.rows) : renderLedgerItem(g.tx);

  function renderLedger() {

      el.innerHTML = '<div class="empty-state">No transactions yet — tap the + button to log your first one.</div>';
      return;

    el.innerHTML = ledgerFilterBarHtml() + '<div id="ledgerListWrap"></div>';
    wireLedgerFilterBar();
    renderLedgerList();
